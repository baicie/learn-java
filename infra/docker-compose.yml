services:
  postgres:
    image: postgres:16
    container_name: aegisops-postgres
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: aegisops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops -d aegisops"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegisops-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ClickHouse 是规划中的 OLAP 存储，当前 MVP 后端没有 Java/前端代码连接它。
  # 为避免本地 docker 内存压力（约 800MB+）并保持一键启动轻量，先整体注释。
  # 启用方法：取消下方注释并同步在 deploy/helm/aegisops/values.yaml 注入 external.clickhouse。
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.12
  #   container_name: aegisops-clickhouse
  #   ports:
  #     - "8123:8123"
  #     - "9000:9000"
  #   environment:
  #     CLICKHOUSE_DB: aegisops
  #     CLICKHOUSE_USER: aegisops
  #     CLICKHOUSE_PASSWORD: aegisops
  #   volumes:
  #     - clickhouse_data:/var/lib/clickhouse
  #   restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.109.1
    container_name: aegisops-victoriametrics
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vm_data:/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aegisops-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
      - "9002:9000"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/aegisops-work-record
    restart: "no"

  zabbix-postgres:
    image: postgres:16-alpine
    container_name: aegisops-zabbix-postgres
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
    volumes:
      - zabbix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: aegisops-zabbix-server
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      ZBX_CACHESIZE: 128M
    ports:
      - "10051:10051"
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: aegisops-zabbix-web
    depends_on:
      - zabbix-server
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      PHP_TZ: Asia/Tokyo
    ports:
      - "8081:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: aegisops-zabbix-agent2
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: zabbix-agent2
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_ACTIVE: zabbix-server
    ports:
      - "10050:10050"
    restart: unless-stopped

  aiops-agent:
    build:
      context: ../apps/aiops-agent
      dockerfile: Dockerfile
    container_name: aegisops-agent
    environment:
      AIOPS_AGENT_INBOUND_AUTH_MODE: static
      AIOPS_AGENT_INTERNAL_AGENT_TOKEN: ${AIOPS_JAVA_TO_AGENT_TOKEN:-dev-java-to-agent-token}
      AIOPS_AGENT_OUTBOUND_AUTH_MODE: static
      AIOPS_AGENT_OUTBOUND_STATIC_TOKEN: ${AIOPS_AGENT_TO_JAVA_TOKEN:-dev-agent-to-java-token}
      AIOPS_AGENT_DIAGNOSIS_GRANT_REQUIRED: "true"
      AIOPS_AGENT_PROVIDER: aiops-agent
      AIOPS_AGENT_NAME: aegisops_diagnosis_graph
      AIOPS_AGENT_AGENT_NAME: aegisops_diagnosis_graph
      AIOPS_AGENT_CONTRACT_VERSION: agent-diagnosis.v1
      AIOPS_AGENT_GENERATION_MODE: openai-compatible
      AIOPS_AGENT_MODEL: deepseek-v4-flash
      # Phase4.2 LLM provider
      AIOPS_AGENT_OPENAI_BASE_URL: https://api.deepseek.com/v1
      AIOPS_AGENT_OPENAI_API_KEY: ${AIOPS_DEEPSEEK_API_KEY}
      AIOPS_AGENT_OPENAI_TIMEOUT_SECONDS: 60
      AIOPS_AGENT_OPENAI_TEMPERATURE: 0.2
      AIOPS_AGENT_OPENAI_MAX_TOKENS: 1200
      AIOPS_AGENT_OPENAI_RESPONSE_FORMAT_ENABLED: "true"
      # Phase4.3 evidence tool. Disabled by default to keep local stack self-contained.
      AIOPS_AGENT_EVIDENCE_ENABLED: "false"
      AIOPS_AGENT_EVIDENCE_BASE_URL: http://aiops-server:8080/internal/agent/evidence
      AIOPS_AGENT_EVIDENCE_TIMEOUT_SECONDS: 5
      # Phase4.4 observability. When enabled, response.raw carries agentRun + agentEval.
      AIOPS_AGENT_TRACE_ENABLED: "true"
      AIOPS_AGENT_EVAL_ENABLED: "true"
      # Phase7 canonical workflow. It only queries Java internal APIs and never calls runner.
      AIOPS_AGENT_WORKFLOW_API_BASE_URL: http://aiops-server:8080
      AIOPS_AGENT_WORKFLOW_EVIDENCE_ENABLED: "true"
      AIOPS_AGENT_WORKFLOW_CASE_RETRIEVAL_ENABLED: "true"
      AIOPS_AGENT_WORKFLOW_HUMAN_CHECKPOINT_ENABLED: "false"
      AIOPS_AGENT_WORKFLOW_MULTI_AGENT_ENABLED: "false"
      AIOPS_AGENT_WORKFLOW_MEMORY_ENABLED: "true"
      AIOPS_AGENT_WORKFLOW_MEMORY_WRITE_ENABLED: "false"
      # Optional Dify work-record provider. Keep credentials in the local .env file.
      AIOPS_AGENT_WORK_RECORD_PROVIDER: ${AIOPS_AGENT_WORK_RECORD_PROVIDER:-deterministic}
      AIOPS_AGENT_DIFY_BASE_URL: ${AIOPS_AGENT_DIFY_BASE_URL:-https://dify.example.com/v1}
      AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY: ${AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY:-}
      AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_ID: ${AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_ID:-}
      AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_VERSION: ${AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_VERSION:-work-record-2026-07-19.1}
      AIOPS_AGENT_DIFY_TIMEOUT_SECONDS: ${AIOPS_AGENT_DIFY_TIMEOUT_SECONDS:-75}
      AIOPS_AGENT_DIFY_MAX_RETRIES: ${AIOPS_AGENT_DIFY_MAX_RETRIES:-2}
      AIOPS_AGENT_DIFY_MAX_INPUT_BYTES: ${AIOPS_AGENT_DIFY_MAX_INPUT_BYTES:-65536}
      AIOPS_AGENT_DIFY_USER_HMAC_SECRET: ${AIOPS_AGENT_DIFY_USER_HMAC_SECRET:-}
    ports:
      - "9008:9008"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  # clickhouse_data:  # 点击上方注释块解除注释后同步打开
  vm_data:
  minio_data:
  zabbix_postgres_data:
