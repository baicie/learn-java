services:
  postgres:
    image: postgres:16
    container_name: aegisops-postgres
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: aegisops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops -d aegisops"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegisops-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: aegisops-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: aegisops
      CLICKHOUSE_USER: aegisops
      CLICKHOUSE_PASSWORD: aegisops
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.109.1
    container_name: aegisops-victoriametrics
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vm_data:/storage

  minio:
    image: minio/minio:latest
    container_name: aegisops-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
      - "9002:9000"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  vm_data:
  minio_data:
