services:
  postgres:
    image: postgres:16
    container_name: aegisops-postgres
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: aegisops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops -d aegisops"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegisops-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: aegisops-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: aegisops
      CLICKHOUSE_USER: aegisops
      CLICKHOUSE_PASSWORD: aegisops
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.109.1
    container_name: aegisops-victoriametrics
    ports:
      - "8428:8428"
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=30d"
    volumes:
      - vm_data:/storage

  minio:
    image: minio/minio:latest
    container_name: aegisops-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
      - "9002:9000"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  zabbix-postgres:
    image: postgres:16-alpine
    container_name: aegisops-zabbix-postgres
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
    volumes:
      - zabbix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: aegisops-zabbix-server
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      ZBX_CACHESIZE: 128M
    ports:
      - "10051:10051"
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: aegisops-zabbix-web
    depends_on:
      - zabbix-server
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
      PHP_TZ: Asia/Tokyo
    ports:
      - "8081:8080"
    restart: unless-stopped

  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: aegisops-zabbix-agent2
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: zabbix-agent2
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_ACTIVE: zabbix-server
    ports:
      - "10050:10050"
    restart: unless-stopped

  aiops-agent:
    build:
      context: ../apps/aiops-agent
      dockerfile: Dockerfile
    container_name: aegisops-agent
    environment:
      AIOPS_AGENT_INTERNAL_TOKEN: dev-internal-token
      AIOPS_AGENT_PROVIDER: aiops-agent
      AIOPS_AGENT_MODEL: langgraph-deterministic
      AIOPS_AGENT_NAME: aegisops_diagnosis_graph
      AIOPS_AGENT_AGENT_NAME: aegisops_diagnosis_graph
      AIOPS_AGENT_CONTRACT_VERSION: agent-diagnosis.v1
      AIOPS_AGENT_GENERATION_MODE: deterministic
      # Phase4.2 optional LLM provider. Keep empty in local/CI deterministic mode.
      AIOPS_AGENT_OPENAI_BASE_URL: ""
      AIOPS_AGENT_OPENAI_API_KEY: ""
      AIOPS_AGENT_OPENAI_TIMEOUT_SECONDS: 30
      AIOPS_AGENT_OPENAI_TEMPERATURE: 0.2
      AIOPS_AGENT_OPENAI_MAX_TOKENS: 1200
      AIOPS_AGENT_OPENAI_RESPONSE_FORMAT_ENABLED: "true"
    ports:
      - "9008:9008"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  vm_data:
  minio_data:
  zabbix_postgres_data:
