spring:
  application:
    name: aiops-runner
  datasource:
    url: ${AIOPS_DB_URL:jdbc:postgresql://localhost:5432/aegisops}
    username: ${AIOPS_DB_USERNAME:aegisops}
    password: ${AIOPS_DB_PASSWORD:aegisops}
    hikari:
      maximum-pool-size: 10
server:
  port: ${AIOPS_RUNNER_PORT:8092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${AIOPS_APP_NAME:aiops-runner}
  prometheus:
    metrics:
      export:
        enabled: true

aiops:
  observability:
    enabled: ${AIOPS_OBSERVABILITY_ENABLED:true}
    service-name: ${AIOPS_APP_NAME:aiops-runner}
    request-id-header: ${AIOPS_REQUEST_ID_HEADER:X-Request-Id}
    trace-id-header: ${AIOPS_TRACE_ID_HEADER:X-Trace-Id}
    http-metrics-enabled: ${AIOPS_HTTP_METRICS_ENABLED:true}
  execution:
    api-enabled: false
    live-enabled: false
    lease-seconds: ${AIOPS_EXECUTION_LEASE_SECONDS:60}
    run-timeout-seconds: ${AIOPS_EXECUTION_RUN_TIMEOUT_SECONDS:1800}
    step-timeout-seconds: ${AIOPS_EXECUTION_STEP_TIMEOUT_SECONDS:300}
    max-retry-attempts: ${AIOPS_EXECUTION_MAX_RETRY_ATTEMPTS:3}
  runner:
    enabled: true
    runner-id: ${AIOPS_RUNNER_ID:local-runner}
    poll-delay-ms: ${AIOPS_RUNNER_POLL_MS:5000}
    timeout-sweep-delay-ms: ${AIOPS_RUNNER_SWEEP_MS:10000}
    max-runs-per-tick: ${AIOPS_RUNNER_MAX_PER_TICK:1}
    timeout-sweep-limit: ${AIOPS_RUNNER_SWEEP_LIMIT:20}
    execution-grant:
      issuer: ${AIOPS_EXECUTION_GRANT_ISSUER:aegisops-app}
      audience: ${AIOPS_EXECUTION_GRANT_AUDIENCE:aiops-runner}
      scope: ${AIOPS_EXECUTION_GRANT_SCOPE:runbook:execute}
      current-key-id: ${AIOPS_EXECUTION_GRANT_KEY_ID:task-grant-v1}
      current-public-key-file: ${AIOPS_EXECUTION_GRANT_PUBLIC_KEY_FILE:}
      previous-key-id: ${AIOPS_EXECUTION_GRANT_PREVIOUS_KEY_ID:}
      previous-public-key-file: ${AIOPS_EXECUTION_GRANT_PREVIOUS_PUBLIC_KEY_FILE:}
    ansible:
      check-execution-enabled: ${AIOPS_RUNNER_ANSIBLE_CHECK_ENABLED:true}
      binary: ${AIOPS_RUNNER_ANSIBLE_BINARY:ansible-playbook}
      workspace-root: ${AIOPS_RUNNER_ANSIBLE_WORKSPACE_ROOT:.runtime/ansible/workspaces}
      resource-root: ${AIOPS_RUNNER_ANSIBLE_RESOURCE_ROOT:.runtime/ansible/resources}
      cleanup-workspace: ${AIOPS_RUNNER_ANSIBLE_CLEANUP_WORKSPACE:true}
      max-output-chars: ${AIOPS_RUNNER_ANSIBLE_MAX_OUTPUT_CHARS:65536}
      max-materialized-file-bytes: ${AIOPS_RUNNER_ANSIBLE_MAX_MATERIALIZED_FILE_BYTES:1048576}
  runtime:
    phase: ${AIOPS_RUNTIME_PHASE:phase5}
