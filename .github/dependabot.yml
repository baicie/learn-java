version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "02:00"
      timezone: "Asia/Shanghai"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 1

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 1

  - package-ecosystem: "npm"
    directory: "/web/console"
    schedule:
      interval: "weekly"
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 1
