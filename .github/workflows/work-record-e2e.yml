name: Work Record E2E

on:
  workflow_dispatch:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  contents: read

concurrency:
  group: >
    work-record-e2e-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  enterprise-e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(
        github.event.pull_request.labels.*.name,
        'e2e'
      )

    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 35
    env:
      POSTGRES_CONTAINER: work-record-postgres-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Prepare Docker
        run: bash scripts/ci/prepare-docker.sh

      - name: Start PostgreSQL
        run: |
          docker run --detach --rm \
            --name "$POSTGRES_CONTAINER" \
            --env POSTGRES_DB=aegisops \
            --env POSTGRES_USER=aegisops \
            --env POSTGRES_PASSWORD=aegisops \
            --publish 127.0.0.1::5432 \
            postgres:16-alpine

          PGPORT="$(
            docker port "$POSTGRES_CONTAINER" 5432/tcp \
              | sed -E 's/.*:([0-9]+)$/\1/' \
              | head -n 1
          )"
          test -n "$PGPORT"
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"

          for attempt in $(seq 1 20); do
            if docker exec "$POSTGRES_CONTAINER" \
              pg_isready -U aegisops -d aegisops; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$POSTGRES_CONTAINER"
          exit 1

      - name: Enable pnpm
        run: |
          corepack enable
          if ! command -v pnpm >/dev/null 2>&1 \
            || [ "$(pnpm --version)" != "10.33.4" ]; then
            corepack prepare pnpm@10.33.4 --activate
          fi
          pnpm --version

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build current backend commit
        run: |
          mvn -B -ntp \
            -pl apps/aiops-server \
            -am \
            -DskipTests \
            package

      - name: Start current backend commit
        env:
          AIOPS_DB_USERNAME: aegisops
          AIOPS_DB_PASSWORD: aegisops
          AIOPS_SERVER_PORT: "8080"
          AIOPS_JWT_SECRET: phase18-e2e-secret-change-me-change-me
          AIOPS_JWT_TTL_SECONDS: "900"
          AIOPS_OBSERVABILITY_ENABLED: "false"
          AIOPS_EVIDENCE_VICTORIA_ENABLED: "false"
        run: |
          export AIOPS_DB_URL="jdbc:postgresql://127.0.0.1:${PGPORT}/aegisops"

          SERVER_JAR="$(
            find apps/aiops-server/target \
              -maxdepth 1 \
              -name 'aiops-server-*.jar' \
              ! -name '*.original' \
              | head -n 1
          )"

          test -n "$SERVER_JAR"

          nohup java -jar "$SERVER_JAR" \
            > /tmp/aiops-server.log 2>&1 &

          echo $! > /tmp/aiops-server.pid

          for attempt in $(seq 1 90); do
            if curl -fsS \
              http://127.0.0.1:8080/actuator/health \
              >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          cat /tmp/aiops-server.log
          exit 1

      - name: Seed ephemeral E2E users
        env:
          PGPASSWORD: aegisops
        run: |
          psql \
            -h 127.0.0.1 \
            -p "$PGPORT" \
            -U aegisops \
            -d aegisops \
            -f scripts/ci/seed-work-record-e2e.sql

      - name: Install Chromium
        run: pnpm -C web/portal run e2e:install

      - name: Start current portal commit
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: |
          nohup pnpm -C web/portal \
            run dev -- \
            --host 127.0.0.1 \
            --port 5173 \
            > /tmp/aegisops-portal.log 2>&1 &

          echo $! > /tmp/aegisops-portal.pid

          for attempt in $(seq 1 60); do
            if curl -fsS \
              http://127.0.0.1:5173 \
              >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          cat /tmp/aegisops-portal.log
          exit 1

      - name: Run enterprise E2E
        env:
          E2E_API_BASE_URL: http://127.0.0.1:8080
          E2E_PORTAL_BASE_URL: http://127.0.0.1:5173

          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: admin123

          E2E_USER_A_USERNAME: phase18-user-a
          E2E_USER_A_PASSWORD: Acc3ptance!2026

          E2E_USER_B_USERNAME: phase18-user-b
          E2E_USER_B_PASSWORD: Acc3ptance!2026
        run: pnpm -C web/portal run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: work-record-playwright-report
          path: web/portal/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: work-record-playwright-traces
          path: web/portal/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: work-record-e2e-service-logs
          path: |
            /tmp/aiops-server.log
            /tmp/aegisops-portal.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup services
        if: always()
        run: |
          if [ -f /tmp/aiops-server.pid ]; then
            kill "$(cat /tmp/aiops-server.pid)" || true
          fi
          if [ -f /tmp/aegisops-portal.pid ]; then
            kill "$(cat /tmp/aegisops-portal.pid)" || true
          fi
          docker rm --force "$POSTGRES_CONTAINER" || true
