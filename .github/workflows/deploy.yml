name: Deploy

on:
  pull_request:
    branches:
      - mvp
      - main
    paths:
      - "apps/**"
      - "modules/**"
      - "web/**"
      - "contracts/**"
      - "deploy/**"
      - "scripts/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - "pom.xml"
      - "pnpm-lock.yaml"
      - "package.json"
  push:
    branches:
      - main
      - mvp
    paths:
      - "apps/**"
      - "modules/**"
      - "web/**"
      - "contracts/**"
      - "deploy/**"
      - "scripts/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
      - "pom.xml"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: deploy-aegisops-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/aegisops

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate repository build descriptors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          pom_files = sorted(Path('.').rglob('pom.xml'))
          if not pom_files:
              raise SystemExit('No pom.xml files found')

          for pom in pom_files:
              try:
                  ET.parse(pom)
              except ET.ParseError as exc:
                  raise SystemExit(f'Invalid XML in {pom}: {exc}') from exc

          print(f'Validated {len(pom_files)} Maven POM files')
          PY
          bash -n deploy/scripts/deploy-app.sh
          docker compose -f deploy/docker-compose.app.yml config --quiet

      - name: Build production server bundle
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl apps/aiops-server -am
          package -DskipTests -Pwith-portal

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aiops-server
            context: .
            dockerfile: ./apps/aiops-server/Dockerfile
            image: ""
            build_args: ""
          - name: aiops-agent
            context: ./apps/aiops-agent
            dockerfile: ./apps/aiops-agent/Dockerfile
            image: /aiops-agent
            build_args: ""
          - name: aiops-worker
            context: .
            dockerfile: ./deploy/docker/java-app.Dockerfile
            image: /aiops-worker
            build_args: |
              APP_MODULE=apps/aiops-worker
              APP_NAME=aiops-worker
              APP_PORT=8081
          - name: aiops-runner
            context: .
            dockerfile: ./apps/aiops-runner/Dockerfile
            image: /aiops-runner
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  deploy:
    name: Deploy to Tencent Cloud VM
    needs:
      - preflight
      - build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: aegisops-prod
    permissions:
      contents: read
    steps:
      - name: Deploy immutable image set
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_DIR="$HOME/workspace/aegisops"
            BRANCH='${{ github.ref_name }}'

            echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login \
              --username '${{ secrets.DOCKERHUB_USERNAME }}' \
              --password-stdin

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch "$BRANCH" --depth 1 \
                https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH" --depth 1
            git reset --hard FETCH_HEAD
            git clean -fd --exclude deploy/.runtime --exclude .env

            APP_DIR="$APP_DIR" \
            IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}' \
            IMAGE_TAG='${{ github.sha }}' \
            HEALTH_TIMEOUT_SECONDS=300 \
              bash deploy/scripts/deploy-app.sh
