name: Deploy

on:
  # 只在 mvp 的发布验证全部通过后自动发布。
  workflow_run:
    workflows:
      - Release Verify
    types:
      - completed
    branches:
      - mvp

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aegisops-mvp
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/aegisops
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  preflight:
    name: Release preflight
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Validate release descriptors
        run: bash scripts/ci/release-preflight.sh

  build-images:
    name: Build ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 35
    needs: preflight
    environment:
      name: aegisops-prod

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aiops-server
            tag_suffix: server
            context: .
            dockerfile: ./apps/aiops-server/Dockerfile
            build_args: ""
          - name: aiops-agent
            tag_suffix: agent
            context: ./apps/aiops-agent
            dockerfile: ./apps/aiops-agent/Dockerfile
            build_args: ""
          - name: aiops-worker
            tag_suffix: worker
            context: .
            dockerfile: ./deploy/docker/java-app.Dockerfile
            build_args: |
              APP_MODULE=apps/aiops-worker
              APP_NAME=aiops-worker
              APP_PORT=8081
          - name: aiops-runner
            tag_suffix: runner
            context: .
            dockerfile: ./apps/aiops-runner/Dockerfile
            build_args: ""

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Prepare Docker
        run: bash scripts/ci/prepare-docker.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  runtime-smoke:
    name: Runtime smoke
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 15
    needs: build-images
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Prepare Docker
        run: bash scripts/ci/prepare-docker.sh

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Start immutable release and verify health
        env:
          APP_DIR: ${{ github.workspace }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash deploy/scripts/deploy-app.sh

      - name: Cleanup runtime smoke
        if: always()
        env:
          AIOPS_SERVER_IMAGE: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-server
          AIOPS_AGENT_IMAGE: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-agent
          AIOPS_WORKER_IMAGE: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-worker
          AIOPS_RUNNER_IMAGE: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-runner
        run: docker compose -f deploy/docker-compose.app.yml down --volumes --remove-orphans || true

  deploy:
    name: Deploy to Tencent Cloud VM
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 25
    needs: runtime-smoke
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Copy deployment descriptors
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          source: "deploy/docker-compose.app.yml,deploy/scripts/deploy-app.sh,deploy/scripts/configure-docker-mirror.sh"
          target: "~/workspace/aegisops"
          overwrite: true
          timeout: 10m
          command_timeout: 10m

      - name: Configure Tencent Cloud Docker mirror
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 10m
          script: |
            bash -lc '
              set -Eeuo pipefail
              MIRROR_SCRIPT="$HOME/workspace/aegisops/deploy/scripts/configure-docker-mirror.sh"
              test -f "$MIRROR_SCRIPT"
              chmod +x "$MIRROR_SCRIPT"
              exec bash "$MIRROR_SCRIPT"
            '

      - name: Apply immutable release
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 20m
          envs: IMAGE_PREFIX,IMAGE_TAG
          script: |
            bash -lc '
              set -Eeuo pipefail
              APP_DIR="$HOME/workspace/aegisops"
              DEPLOY_SCRIPT="$APP_DIR/deploy/scripts/deploy-app.sh"
              test -f "$DEPLOY_SCRIPT"
              chmod +x "$DEPLOY_SCRIPT"
              export APP_DIR
              exec bash "$DEPLOY_SCRIPT"
            '
