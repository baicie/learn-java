name: Deploy

on:
  # 只在 mvp 的发布验证全部通过后自动发布。
  workflow_run:
    workflows:
      - Release Verify
    types:
      - completed
    branches:
      - mvp

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aegisops-mvp
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/aegisops
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  preflight:
    name: Release preflight
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      release_required: ${{ steps.scope.outputs.release_required }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 2

      - name: Detect release-relevant changes
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ] \
            || ! git rev-parse HEAD^ >/dev/null 2>&1 \
            || ! git diff --quiet HEAD^ HEAD -- \
              apps modules web contracts deploy scripts infra/checkstyle \
              pom.xml package.json pnpm-lock.yaml pnpm-workspace.yaml \
              .dockerignore .github/workflows/release-verify.yml \
              .github/workflows/deploy.yml; then
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.scope.outputs.release_required == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        if: steps.scope.outputs.release_required == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Docker Compose
        if: steps.scope.outputs.release_required == 'true'
        uses: docker/setup-compose-action@v2

      - name: Validate release descriptors
        if: steps.scope.outputs.release_required == 'true'
        run: bash scripts/ci/release-preflight.sh

  publish-images:
    name: Publish verified images
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 60
    needs: preflight
    if: needs.preflight.outputs.release_required == 'true'
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Prepare Docker
        run: bash scripts/ci/prepare-docker.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Reuse verified images or build missing images
        run: |
          set -Eeuo pipefail

          ensure_image() {
            local image=$1
            shift
            if docker image inspect "$image" >/dev/null 2>&1; then
              echo "Reusing $image from Release Verify"
              return 0
            fi
            echo "$image is missing; rebuilding with the host Docker cache"
            docker build --tag "$image" "$@"
          }

          ensure_image "local/aegisops:${RELEASE_REF}-server" \
            --file apps/aiops-server/Dockerfile .
          ensure_image "local/aegisops:${RELEASE_REF}-agent" \
            --file apps/aiops-agent/Dockerfile apps/aiops-agent
          ensure_image "local/aegisops:${RELEASE_REF}-worker" \
            --file deploy/docker/java-app.Dockerfile \
            --build-arg APP_MODULE=apps/aiops-worker \
            --build-arg APP_NAME=aiops-worker \
            --build-arg APP_PORT=8081 .
          ensure_image "local/aegisops:${RELEASE_REF}-runner" \
            --file apps/aiops-runner/Dockerfile .

      - name: Push immutable images
        run: |
          set -Eeuo pipefail
          for component in server agent worker runner; do
            local_image="local/aegisops:${RELEASE_REF}-${component}"
            remote_image="${IMAGE_PREFIX}:${IMAGE_TAG}-${component}"
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image"
          done

  runtime-smoke:
    name: Runtime smoke
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 15
    needs: publish-images
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Prepare Docker
        run: bash scripts/ci/prepare-docker.sh

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Start immutable release and verify health
        env:
          APP_DIR: ${{ github.workspace }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash deploy/scripts/deploy-app.sh

      - name: Cleanup runtime smoke
        if: always()
        env:
          AIOPS_SERVER_IMAGE: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-server
          AIOPS_AGENT_IMAGE: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-agent
          AIOPS_WORKER_IMAGE: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-worker
          AIOPS_RUNNER_IMAGE: ${{ env.IMAGE_PREFIX }}:${{ env.IMAGE_TAG }}-runner
        run: docker compose -f deploy/docker-compose.app.yml down --volumes --remove-orphans || true

  deploy:
    name: Deploy to Tencent Cloud VM
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 25
    needs: runtime-smoke
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Copy deployment descriptors
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          source: "deploy/docker-compose.app.yml,deploy/scripts/deploy-app.sh,deploy/scripts/configure-docker-mirror.sh"
          target: "~/workspace/aegisops"
          overwrite: true
          timeout: 10m
          command_timeout: 10m

      - name: Configure Tencent Cloud Docker mirror
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 10m
          script: |
            bash -lc '
              set -Eeuo pipefail
              MIRROR_SCRIPT="$HOME/workspace/aegisops/deploy/scripts/configure-docker-mirror.sh"
              test -f "$MIRROR_SCRIPT"
              chmod +x "$MIRROR_SCRIPT"
              exec bash "$MIRROR_SCRIPT"
            '

      - name: Apply immutable release
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 20m
          envs: IMAGE_PREFIX,IMAGE_TAG
          script: |
            bash -lc '
              set -Eeuo pipefail
              APP_DIR="$HOME/workspace/aegisops"
              DEPLOY_SCRIPT="$APP_DIR/deploy/scripts/deploy-app.sh"
              test -f "$DEPLOY_SCRIPT"
              chmod +x "$DEPLOY_SCRIPT"
              export APP_DIR
              exec bash "$DEPLOY_SCRIPT"
            '
