name: Deploy

on:
  # 只在 mvp 的 CI 全部通过后自动发布，避免部署任务充当“下一层错误发现器”。
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - mvp

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aegisops-mvp
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/aegisops
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  RELEASE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate release descriptors
        run: bash scripts/ci/release-preflight.sh

  build-images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: preflight
    environment:
      name: aegisops-prod

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aiops-server
            image-suffix: ""
            context: .
            dockerfile: ./apps/aiops-server/Dockerfile
            build-args: ""
          - name: aiops-agent
            image-suffix: /aiops-agent
            context: ./apps/aiops-agent
            dockerfile: ./apps/aiops-agent/Dockerfile
            build-args: ""
          - name: aiops-worker
            image-suffix: /aiops-worker
            context: .
            dockerfile: ./deploy/docker/java-app.Dockerfile
            build-args: |
              APP_MODULE=apps/aiops-worker
              APP_NAME=aiops-worker
              APP_PORT=8081
          - name: aiops-runner
            image-suffix: /aiops-runner
            context: .
            dockerfile: ./apps/aiops-runner/Dockerfile
            build-args: ""

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}${{ matrix.image-suffix }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  deploy:
    name: Deploy to Tencent Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-images
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Copy deployment descriptors
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          source: "deploy/docker-compose.app.yml,deploy/scripts/deploy-app.sh"
          target: "~/workspace/aegisops"
          overwrite: true
          timeout: 10m
          command_timeout: 10m

      - name: Apply immutable release
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 20m
          envs: IMAGE_PREFIX,IMAGE_TAG
          script: |
            set -euo pipefail
            APP_DIR="$HOME/workspace/aegisops"
            chmod +x "$APP_DIR/deploy/scripts/deploy-app.sh"
            APP_DIR="$APP_DIR" \
              IMAGE_PREFIX="$IMAGE_PREFIX" \
              IMAGE_TAG="$IMAGE_TAG" \
              bash "$APP_DIR/deploy/scripts/deploy-app.sh"
