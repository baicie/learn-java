name: Deploy Component

on:
  workflow_dispatch:
    inputs:
      component:
        description: 选择要部署到 AegisOps 服务器的组件
        required: true
        type: choice
        options:
          - zabbix

permissions:
  contents: read
  actions: read

concurrency:
  group: aegisops-prod-deploy
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize mvp deployment
    if: inputs.component == 'zabbix'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require mvp ref with successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF" != "refs/heads/mvp" ]; then
            echo "::error::Production deployment requires refs/heads/mvp."
            exit 1
          fi
          successful_runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f "head_sha=$RELEASE_SHA" \
            -f branch=mvp \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            --jq '.total_count')"
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::No successful CI run found for $RELEASE_SHA."
            exit 1
          fi

  deploy:
    name: Deploy ${{ inputs.component }} to Tencent Cloud VM
    if: inputs.component == 'zabbix'
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout deployment descriptors
        uses: actions/checkout@v7

      - name: Validate Zabbix deployment descriptors
        env:
          ZABBIX_DB_PASSWORD: preflight-only
        run: |
          bash -n deploy/scripts/deploy-zabbix.sh
          bash -n deploy/scripts/backup-zabbix.sh
          bash -n deploy/scripts/restore-zabbix.sh
          bash -n deploy/scripts/promote-deployment-candidate.sh
          bash -n deploy/scripts/ensure-zabbix-api-network.sh
          docker compose -f deploy/docker-compose.zabbix.yml config --quiet

      - name: Generate deployment manifest
        run: |
          sha256sum \
            deploy/docker-compose.zabbix.yml \
            deploy/scripts/deploy-zabbix.sh \
            deploy/scripts/backup-zabbix.sh \
            deploy/scripts/restore-zabbix.sh \
            deploy/scripts/configure-docker-mirror.sh \
            deploy/scripts/ensure-zabbix-api-network.sh \
            deploy/scripts/promote-deployment-candidate.sh \
            > deployment-manifest.sha256

      - name: Verify ED25519 deployment host key
        env:
          PERF_VM_HOST: ${{ secrets.PERF_VM_HOST }}
          PERF_VM_SSH_PORT: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          expected='SHA256:t42JX0HGVD6m/KDVHYjoudZQGMv+8B4hkrfGJdZ8axY'
          scan_output=''
          for attempt in 1 2 3 4 5; do
            scan_output="$(
              ssh-keyscan -4 -T 10 -p "$PERF_VM_SSH_PORT" -t ed25519 "$PERF_VM_HOST" 2>/dev/null || true
            )"
            if [ -n "$scan_output" ]; then
              break
            fi
            sleep "$((attempt * 2))"
          done
          if [ -z "$scan_output" ]; then
            echo 'ED25519 host key scan returned no output after 5 attempts' >&2
            exit 1
          fi
          observed="$(printf '%s\n' "$scan_output" | ssh-keygen -lf - -E sha256 | awk 'NR == 1 { print $2 }')"
          if [ -z "$observed" ]; then
            echo 'ED25519 host key scan output could not be parsed' >&2
            exit 1
          fi
          if [ "$observed" != "$expected" ]; then
            echo "ED25519 host key fingerprint mismatch: observed=$observed expected=$expected" >&2
            exit 1
          fi

      - name: Copy deployment candidate to staging
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          fingerprint: SHA256:TtfGZDilKBdm05HX3b1i4yqG/mG0Ooas43ZBrFKyj2w
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          source: "deployment-manifest.sha256,deploy/docker-compose.zabbix.yml,deploy/scripts/deploy-zabbix.sh,deploy/scripts/backup-zabbix.sh,deploy/scripts/restore-zabbix.sh,deploy/scripts/configure-docker-mirror.sh,deploy/scripts/ensure-zabbix-api-network.sh,deploy/scripts/promote-deployment-candidate.sh"
          target: "~/workspace/aegisops/deploy/staging/zabbix-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          overwrite: true
          timeout: 10m
          command_timeout: 10m

      - name: Deploy staged Zabbix candidate
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        env:
          STAGING_ID: zabbix-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          fingerprint: SHA256:TtfGZDilKBdm05HX3b1i4yqG/mG0Ooas43ZBrFKyj2w
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 20m
          envs: STAGING_ID
          script: |
            bash -lc '
              set -Eeuo pipefail
              APP_DIR="$HOME/workspace/aegisops"
              CANDIDATE_ROOT="$APP_DIR/deploy/staging/$STAGING_ID"
              cd "$CANDIDATE_ROOT"
              sha256sum -c deployment-manifest.sha256
              NETWORK_SCRIPT="$CANDIDATE_ROOT/deploy/scripts/ensure-zabbix-api-network.sh"
              test -f "$NETWORK_SCRIPT"
              bash -n "$CANDIDATE_ROOT/deploy/scripts/"*.sh
              PROMOTE_SCRIPT="$CANDIDATE_ROOT/deploy/scripts/promote-deployment-candidate.sh"
              PROMOTION_REQUIRE_FLOCK=1 bash "$PROMOTE_SCRIPT" \
                --active-root "$APP_DIR" \
                --recover-only
              bash "$NETWORK_SCRIPT"
              current_members="$(docker network inspect \
                --format "{{range .Containers}}{{println .Name}}{{end}}" \
                aegisops-zabbix-api | sed "/^$/d" | sort)"
              expected_members="$(printf "%s\n" aegisops-app aegisops-zabbix-web | sort)"
              if [ "$current_members" != "aegisops-app" ] \
                && [ "$current_members" != "$expected_members" ]; then
                echo "Unexpected aegisops-zabbix-api members before deployment:" >&2
                printf "%s\n" "$current_members" >&2
                exit 1
              fi
              ZABBIX_DB_PASSWORD=preflight-only docker compose \
                -f "$CANDIDATE_ROOT/deploy/docker-compose.zabbix.yml" \
                config --quiet
              predeploy_backup=""
              zabbix_state="$( \
                APP_DIR="$APP_DIR" \
                COMPOSE_FILE="$APP_DIR/deploy/docker-compose.zabbix.yml" \
                ZABBIX_ENV_FILE="$APP_DIR/deploy/.env.zabbix" \
                bash "$CANDIDATE_ROOT/deploy/scripts/backup-zabbix.sh" --probe-only \
              )"
              if [ "$zabbix_state" = "running" ]; then
                predeploy_backup="$( \
                  APP_DIR="$APP_DIR" \
                  COMPOSE_FILE="$APP_DIR/deploy/docker-compose.zabbix.yml" \
                  ZABBIX_ENV_FILE="$APP_DIR/deploy/.env.zabbix" \
                  bash "$CANDIDATE_ROOT/deploy/scripts/backup-zabbix.sh" \
                )"
                echo "Validated pre-promotion Zabbix backup: $predeploy_backup"
              elif [ "$zabbix_state" != "empty" ]; then
                echo "Unexpected Zabbix state probe result: $zabbix_state" >&2
                exit 1
              fi
              promotion_backup="$(PROMOTION_REQUIRE_FLOCK=1 bash "$PROMOTE_SCRIPT" \
                --candidate-root "$CANDIDATE_ROOT" \
                --active-root "$APP_DIR" \
                --manifest "$CANDIDATE_ROOT/deployment-manifest.sha256" \
                --backup-dir "$APP_DIR/deploy/backups/promotion-$STAGING_ID")"
              echo "Active deployment files backed up at $promotion_backup"
              MIRROR_SCRIPT="$APP_DIR/deploy/scripts/configure-docker-mirror.sh"
              DEPLOY_SCRIPT="$APP_DIR/deploy/scripts/deploy-zabbix.sh"
              chmod +x "$MIRROR_SCRIPT" "$DEPLOY_SCRIPT" \
                "$APP_DIR/deploy/scripts/backup-zabbix.sh" \
                "$APP_DIR/deploy/scripts/restore-zabbix.sh"
              bash "$MIRROR_SCRIPT"
              export APP_DIR
              ZABBIX_PREDEPLOY_BACKUP_DIR="$predeploy_backup" bash "$DEPLOY_SCRIPT"
              actual_members="$(docker network inspect \
                --format "{{range .Containers}}{{println .Name}}{{end}}" \
                aegisops-zabbix-api | sed "/^$/d" | sort)"
              if [ "$actual_members" != "$expected_members" ]; then
                echo "Unexpected aegisops-zabbix-api members:" >&2
                printf "%s\n" "$actual_members" >&2
                exit 1
              fi
            '
