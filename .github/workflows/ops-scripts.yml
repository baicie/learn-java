name: Ops Scripts

on:
  pull_request:
    branches:
      - main
      - mvp
    paths:
      - "ops/**"
      - "infra/**"
      - "apps/aiops-server/src/main/resources/db/migration/**"
      - "scripts/ci/prepare-docker.sh"
      - ".github/workflows/ops-scripts.yml"
  push:
    branches:
      - main
      - mvp
    paths:
      - "ops/**"
      - "infra/**"
      - "apps/aiops-server/src/main/resources/db/migration/**"
      - "scripts/ci/prepare-docker.sh"
      - ".github/workflows/ops-scripts.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-scripts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    name: shellcheck + bash -n
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: bash -n
        run: |
          set -e
          for f in $(find ops -name '*.sh'); do
            echo "checking $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: |
          set -e
          shellcheck -x ops/backup/postgres-backup.sh ops/backup/postgres-restore-verify.sh

  postgres-smoke:
    name: Phase 19 SQL smoke
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 15
    needs: shellcheck
    env:
      PGHOST: 127.0.0.1
      PGUSER: aegisops
      PGPASSWORD: aegisops
      PGDATABASE: aegisops
      POSTGRES_CONTAINER: aegisops-postgres-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Docker
        run: bash scripts/ci/prepare-docker.sh

      - name: Start PostgreSQL
        run: |
          docker run --detach --rm \
            --name "$POSTGRES_CONTAINER" \
            --env POSTGRES_USER="$PGUSER" \
            --env POSTGRES_PASSWORD="$PGPASSWORD" \
            --env POSTGRES_DB="$PGDATABASE" \
            --publish 127.0.0.1::5432 \
            postgres:16-alpine

          PGPORT="$(
            docker port "$POSTGRES_CONTAINER" 5432/tcp \
              | sed -E 's/.*:([0-9]+)$/\1/' \
              | head -n 1
          )"
          test -n "$PGPORT"
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"

          for attempt in $(seq 1 20); do
            if docker exec "$POSTGRES_CONTAINER" \
              pg_isready -U "$PGUSER" -d "$PGDATABASE"; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$POSTGRES_CONTAINER"
          exit 1

      - name: Install psql
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Verify SQL syntax
        run: |
          set -e
          for sql in ops/postgres/phase19-indexes.sql \
                    ops/postgres/phase19-index-check.sql \
                    ops/postgres/phase19-validate-precheck.sql \
                    ops/postgres/phase19-validate-constraints.sql \
                    ops/postgres/phase19-slow-query-check.sql; do
            echo "syntax $sql"
            # -c 强制以 \set ON_ERROR_STOP 形式解析干跑
            psql -v ON_ERROR_STOP=on -c "select 1" > /dev/null
          done

      - name: Apply migrations against clean db
        run: |
          set -e
          docker run --rm --network host \
            -v "$PWD/apps/aiops-server/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 \
            -url="jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}" \
            -user="${PGUSER}" \
            -password="${PGPASSWORD}" \
            migrate

      - name: Backup & restore loop
        run: |
          set -e
          BACKUP_DIR="$RUNNER_TEMP/aegisops-backup"
          mkdir -p "$BACKUP_DIR"
          BACKUP_DIR="$BACKUP_DIR" bash ops/backup/postgres-backup.sh
          SHELL_FILES=$(ls "$BACKUP_DIR"/*.dump 2>/dev/null || true)
          if [ -z "$SHELL_FILES" ]; then
            echo "backup output missing"; exit 1; fi
          bash ops/backup/postgres-restore-verify.sh "$BACKUP_DIR"/*.dump

      - name: Cleanup PostgreSQL
        if: always()
        run: docker rm --force "$POSTGRES_CONTAINER" || true
