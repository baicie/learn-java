name: Branch Protection

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated branches to protect"
        required: true
        default: "main,mvp"
      checks:
        description: "Comma-separated required check names"
        required: true
        default: "CI Summary,Block .env and key literals"

permissions:
  contents: read

jobs:
  configure:
    name: Configure branch protection
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: bash scripts/ci/self-hosted-runner-preflight.sh node

      - name: Configure branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH_PROTECTION_BRANCHES: ${{ inputs.branches }}
          BRANCH_PROTECTION_CHECKS: ${{ inputs.checks }}
        run: node scripts/ci/branch-protection.ts
