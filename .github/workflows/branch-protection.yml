name: Branch Protection

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Comma-separated branches to protect"
        required: true
        default: "main,develop"
      checks:
        description: "Comma-separated required check names"
        required: true
        default: "Docs,Backend,Frontend,CI Summary"

permissions:
  contents: read

jobs:
  configure:
    name: Configure branch protection
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Configure branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH_PROTECTION_BRANCHES: ${{ inputs.branches }}
          BRANCH_PROTECTION_CHECKS: ${{ inputs.checks }}
        run: pnpm branch-protection
