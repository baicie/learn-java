name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/**"
      - "modules/**"
      - "web/**"
      - "docs/**"
      - ".agents/**"
      - "scripts/**"
      - "pom.xml"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - "package.json"

  push:
    branches:
      - main
      - develop
    paths:
      - "apps/**"
      - "modules/**"
      - "web/**"
      - "docs/**"
      - ".agents/**"
      - "scripts/**"
      - "pom.xml"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
      - "package.json"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check docs
        run: bash scripts/ci/docs.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify backend
        run: bash scripts/ci/backend.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            web/console/pnpm-lock.yaml

      - name: Verify frontend
        run: bash scripts/ci/frontend.sh
