name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - mvp
    paths:
      - "apps/**"
      - "modules/**"
      - "web/**"
      - "docs/**"
      - "deploy/**"
      - ".agents/**"
      - "scripts/**"
      - "pom.xml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - "package.json"

  push:
    branches:
      - main
      - develop
      - mvp
    paths:
      - "apps/**"
      - "modules/**"
      - "web/**"
      - "docs/**"
      - "deploy/**"
      - ".agents/**"
      - "scripts/**"
      - "pom.xml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - "package.json"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check docs
        run: bash scripts/ci/docs.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Setup Node for jOOQ DDL preparation
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify backend
        run: bash scripts/ci/backend.sh

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            modules/aiops-platform/target/site/jacoco
            modules/aiops-work-record/target/site/jacoco
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify frontend
        run: bash scripts/ci/frontend.sh

      - name: Upload portal coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portal-coverage
          path: web/portal/coverage
          if-no-files-found: error
          retention-days: 14

  agent:
    name: AI Agent
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/aiops-agent/pyproject.toml

      - name: Verify AI agent
        run: bash scripts/ci/agent.sh

  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate release descriptors
        run: bash scripts/ci/release-preflight.sh

  container-build:
    name: Container ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aiops-server
            context: .
            dockerfile: ./apps/aiops-server/Dockerfile
            build_args: ""
          - name: aiops-agent
            context: ./apps/aiops-agent
            dockerfile: ./apps/aiops-agent/Dockerfile
            build_args: ""
          - name: aiops-worker
            context: .
            dockerfile: ./deploy/docker/java-app.Dockerfile
            build_args: |
              APP_MODULE=apps/aiops-worker
              APP_NAME=aiops-worker
              APP_PORT=8081
          - name: aiops-runner
            context: .
            dockerfile: ./apps/aiops-runner/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke-build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [docs, backend, frontend, agent, release-contract, container-build]
    if: always()

    steps:
      - name: Block merge on any failure
        run: |
          if [ "${{ needs.docs.result }}" != "success" ] \
            || [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.agent.result }}" != "success" ] \
            || [ "${{ needs.release-contract.result }}" != "success" ] \
            || [ "${{ needs.container-build.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed. See:"
            echo "::error::  docs=${{ needs.docs.result }}"
            echo "::error::  backend=${{ needs.backend.result }}"
            echo "::error::  frontend=${{ needs.frontend.result }}"
            echo "::error::  agent=${{ needs.agent.result }}"
            echo "::error::  release-contract=${{ needs.release-contract.result }}"
            echo "::error::  container-build=${{ needs.container-build.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
