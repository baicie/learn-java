name: CI

on:
  pull_request:
    branches:
      - main
      - mvp

  push:
    branches:
      - main
      - mvp

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  docs:
    name: Docs
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check docs
        run: bash scripts/ci/docs.sh

  backend:
    name: Backend
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Docker
        uses: docker/setup-docker-action@v5
        with:
          context: ci-${{ github.run_id }}-${{ github.run_attempt }}-backend
          set-host: true

      - name: Verify Docker
        run: docker info

      - name: Verify backend
        run: bash scripts/ci/backend.sh

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            modules/aiops-platform/target/site/jacoco
            modules/aiops-work-record/target/site/jacoco
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Verify frontend
        run: bash scripts/ci/frontend.sh

      - name: Upload portal coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portal-coverage
          path: web/portal/coverage
          if-no-files-found: error
          retention-days: 14

  agent:
    name: AI Agent
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/aiops-agent/pyproject.toml

      - name: Verify AI agent
        run: bash scripts/ci/agent.sh

  summary:
    name: CI Summary
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    needs: [docs, backend, frontend, agent]
    if: always()

    steps:
      - name: Block merge on any failure
        run: |
          if [ "${{ needs.docs.result }}" != "success" ] \
            || [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.agent.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed. See:"
            echo "::error::  docs=${{ needs.docs.result }}"
            echo "::error::  backend=${{ needs.backend.result }}"
            echo "::error::  frontend=${{ needs.frontend.result }}"
            echo "::error::  agent=${{ needs.agent.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
