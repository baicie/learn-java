name: CI

on:
  pull_request:
    branches:
      - main
      - mvp

  push:
    branches:
      - main
      - mvp

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  AIOPS_CI_PREINSTALLED_BROWSER: "1"
  AIOPS_NPM_REGISTRY: ${{ vars.AIOPS_NPM_REGISTRY }}
  AIOPS_PIP_INDEX_URL: ${{ vars.AIOPS_PIP_INDEX_URL }}

jobs:
  docs:
    name: Docs
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: bash scripts/ci/self-hosted-runner-preflight.sh node

      - name: Check docs
        run: bash scripts/ci/docs.sh

  backend:
    name: Backend
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: bash scripts/ci/self-hosted-runner-preflight.sh java docker

      - name: Verify backend
        run: bash scripts/ci/backend.sh

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            modules/aiops-platform/target/site/jacoco
            modules/aiops-work-record/target/site/jacoco
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: bash scripts/ci/self-hosted-runner-preflight.sh node

      - name: Verify frontend
        run: bash scripts/ci/frontend.sh

      - name: Upload portal coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portal-coverage
          path: web/portal/coverage
          if-no-files-found: error
          retention-days: 14

  agent:
    name: AI Agent
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        run: bash scripts/ci/self-hosted-runner-preflight.sh python

      - name: Verify AI agent
        run: bash scripts/ci/agent.sh

  summary:
    name: CI Summary
    runs-on: [self-hosted, linux, x64, aegisops-cn]
    needs: [docs, backend, frontend, agent]
    if: always()

    steps:
      - name: Block merge on any failure
        run: |
          if [ "${{ needs.docs.result }}" != "success" ] \
            || [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.agent.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed. See:"
            echo "::error::  docs=${{ needs.docs.result }}"
            echo "::error::  backend=${{ needs.backend.result }}"
            echo "::error::  frontend=${{ needs.frontend.result }}"
            echo "::error::  agent=${{ needs.agent.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
