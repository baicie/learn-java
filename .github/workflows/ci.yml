name: CI

on:
  pull_request:
    branches:
      - main
      - mvp

  push:
    branches:
      - main
      - mvp

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  TZ: Asia/Shanghai

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check docs
        run: bash scripts/ci/docs.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify backend
        run: bash scripts/ci/backend.sh

      - name: Upload backend coverage
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            modules/aiops-platform/target/site/jacoco
            modules/aiops-work-record/target/site/jacoco
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          if ! command -v pnpm >/dev/null 2>&1 \
            || [ "$(pnpm --version)" != "10.33.4" ]; then
            corepack prepare pnpm@10.33.4 --activate
          fi
          pnpm --version

      - name: Verify local startup process
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm test:start

      - name: Verify frontend
        run: bash scripts/ci/frontend.sh

      - name: Upload portal coverage
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portal-coverage
          path: web/portal/coverage
          if-no-files-found: warn
          retention-days: 14

  agent:
    name: AI Agent
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify AI agent
        run: bash scripts/ci/agent.sh

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Verify deployment security
        run: bash scripts/ci/deployment.sh

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [docs, backend, frontend, agent, deployment]
    if: ${{ !cancelled() }}

    steps:
      - name: Block merge on any failure
        run: |
          if [ "${{ needs.docs.result }}" != "success" ] \
            || [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.agent.result }}" != "success" ] \
            || [ "${{ needs.deployment.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed. See:"
            echo "::error::  docs=${{ needs.docs.result }}"
            echo "::error::  backend=${{ needs.backend.result }}"
            echo "::error::  frontend=${{ needs.frontend.result }}"
            echo "::error::  agent=${{ needs.agent.result }}"
            echo "::error::  deployment=${{ needs.deployment.result }}"
            exit 1
          fi
          echo "All CI jobs passed."
