name: Secrets Guard

# 守门：禁止任何 .env / .env.* 文件被加入 git 跟踪，
# 禁止在 diff / staged 中出现常见密钥字面量前缀。
# 触发：PR + push（不限路径，因为 .env 可能出现在任何目录）。

on:
  pull_request:
    branches:
      - main
      - mvp
  push:
    branches:
      - main
      - mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-guard-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Block .env and key literals
    runs-on: self-hosted
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for .env
        run: |
          echo "::group::tracked .env files"
          tracked_env=$(git ls-files | grep -E '(^|/)(\.env|\.env\.[^/]+)$' || true)
          if [ -n "$tracked_env" ]; then
            echo "::error::Tracked .env files detected:"
            echo "$tracked_env"
            exit 1
          fi
          echo "OK: no tracked .env files"
          echo "::endgroup::"

      - name: Scan staged diff for key literals
        run: |
          echo "::group::staged key literal scan"
          staged=$(git diff --staged --no-color --unified=0 || true)
          # 常见密钥前缀：sk-（DeepSeek/OpenAI/Anthropic）/ AIza（Google）/ AKIA（AWS）/ ghp_/gho_（GitHub）/ xox[bpars]-（Slack）
          if echo "$staged" | grep -E '(sk-[A-Za-z0-9_-]{16,}|AIza[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[bpars]-[A-Za-z0-9-]{10,})' >/dev/null; then
            echo "::error::Possible key literal in staged diff:"
            echo "$staged" | grep -E '(sk-[A-Za-z0-9_-]{16,}|AIza[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[bpars]-[A-Za-z0-9-]{10,})' | head -5
            exit 1
          fi
          echo "OK: no obvious key literals in staged diff"
          echo "::endgroup::"

      - name: Scan last commit diff for key literals
        run: |
          echo "::group::HEAD diff key literal scan"
          head_diff=$(git diff --no-color --unified=0 HEAD~1 HEAD 2>/dev/null || git show --no-color --unified=0 HEAD || true)
          if echo "$head_diff" | grep -E '(sk-[A-Za-z0-9_-]{16,}|AIza[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[bpars]-[A-Za-z0-9-]{10,})' >/dev/null; then
            echo "::error::Possible key literal in HEAD diff:"
            echo "$head_diff" | grep -E '(sk-[A-Za-z0-9_-]{16,}|AIza[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[bpars]-[A-Za-z0-9-]{10,})' | head -5
            exit 1
          fi
          echo "OK: no obvious key literals in HEAD diff"
          echo "::endgroup::"
