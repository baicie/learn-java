name: Phase 21 Portal Migration

on:
  pull_request:
    branches:
      - mvp
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: phase21-portal-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'feat/portal-remove-features-shadcn-multi-template'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Reconstruct and verify migration package
        shell: bash
        run: |
          set -euo pipefail
          payload=.github/phase21-payload
          archive_b64="$RUNNER_TEMP/phase21-runtime-package.tar.xz.b64"
          archive="$RUNNER_TEMP/phase21-runtime-package.tar.xz"
          cat "$payload/chunk-00.b64" "$payload/chunk-01.b64" > "$archive_b64"
          while IFS= read -r part; do
            tail -n +2 "$part" >> "$archive_b64"
          done < <(find "$payload" -maxdepth 1 -name 'part-*.txt' -print | sort -V)
          base64 --decode "$archive_b64" > "$archive"
          echo '20645f0aeff0a738507ac58e535bf808d77f4bb92459d234f32e0a28edb59f23  '"$archive" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/phase21-runtime"
          tar -xJf "$archive" -C "$RUNNER_TEMP/phase21-runtime"

      - name: Normalize migration package
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/phase21-runtime/phase21-runtime-package"
          normalizer="$RUNNER_TEMP/phase21-normalize.py"
          cp .github/phase21-payload/normalize.py "$normalizer"

          python3 - "$normalizer" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding='utf-8')
          old = "ui_fix_source = textwrap.dedent(\n    '''\\\n"
          new = "ui_fix_source = textwrap.dedent(\n    r'''\\\n"
          if old not in content:
              raise SystemExit('ui_fix_source raw-string marker not found')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

          python3 "$normalizer" "$package"

          python3 - "$package/scripts/fix-remaining-ui.py" <<'PY'
          import sys
          import textwrap
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding='utf-8')
          if content.startswith('\\\n'):
              content = content[2:]
          path.write_text(textwrap.dedent(content).lstrip('\n'), encoding='utf-8')
          PY
          python3 -m py_compile "$package/scripts/fix-remaining-ui.py"

          cat > "$package/scripts/fix-migration-paths.py" <<'PY'
          from pathlib import Path


          def replace(path: Path, old: str, new: str) -> None:
              if not path.exists():
                  return
              content = path.read_text(encoding='utf-8')
              if old in content:
                  path.write_text(content.replace(old, new), encoding='utf-8')


          replace(
              Path('web/portal/src/pages/DashboardPage.tsx'),
              "from './components/",
              "from '@/components/dashboard/",
          )

          iam_dir = Path('web/portal/src/components/platform/iam')
          create_dialog_source = iam_dir / 'platform-user-create-dialog.tsx'
          create_dialog_target = iam_dir / 'PlatformUserCreateDialog.tsx'
          if create_dialog_source.exists():
              if create_dialog_target.exists():
                  create_dialog_source.unlink()
              else:
                  create_dialog_source.rename(create_dialog_target)

          risk_source = Path(
              'web/portal/src/components/work-records/designer/field-delete-risk.tsx'
          )
          risk_target = Path(
              'web/portal/src/lib/work-records/designer/field-delete-risk.tsx'
          )
          generated_risk = risk_target.with_suffix('.ts')
          if generated_risk.exists():
              generated_risk.unlink()
          if risk_source.exists():
              risk_target.parent.mkdir(parents=True, exist_ok=True)
              if risk_target.exists():
                  risk_source.unlink()
              else:
                  risk_source.rename(risk_target)
          PY
          python3 -m py_compile "$package/scripts/fix-migration-paths.py"

          python3 - "$package/scripts/phase21-07-cleanup.sh" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding='utf-8')

          ui_marker = 'python3 "$PACKAGE_ROOT/scripts/fix-remaining-ui.py"\n'
          ui_replacement = (
              ui_marker
              + 'python3 "$PACKAGE_ROOT/scripts/fix-migration-paths.py"\n'
          )
          if ui_marker not in content:
              raise SystemExit('phase21-07 UI fix marker not found')
          content = content.replace(ui_marker, ui_replacement, 1)

          install_marker = 'pnpm --dir web/portal install --frozen-lockfile'
          if install_marker not in content:
              raise SystemExit('phase21-07 frozen install marker not found')
          content = content.replace(
              install_marker,
              'pnpm --dir web/portal install --no-frozen-lockfile',
              1,
          )
          path.write_text(content, encoding='utf-8')
          PY

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply portal migration and run frontend CI
        id: apply_migration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            bash "$RUNNER_TEMP/phase21-runtime/phase21-runtime-package/scripts/apply-all.sh"
            pnpm --dir web/portal run knip
          } 2>&1 | tee "$RUNNER_TEMP/phase21-apply.log"

      - name: Publish migration failure details
        if: steps.apply_migration.outcome == 'failure'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          tail -n 300 "$RUNNER_TEMP/phase21-apply.log" > "$RUNNER_TEMP/phase21-failure.log"
          git reset --hard HEAD
          cp "$RUNNER_TEMP/phase21-failure.log" .github/phase21-payload/failure.log
          git add -f .github/phase21-payload/failure.log
          if ! git diff --cached --quiet; then
            git commit --no-verify -m 'chore(portal): 回写统一迁移失败日志 [skip ci]'
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
          cat .github/phase21-payload/failure.log
          exit 1

      - name: Validate documentation
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          bash scripts/ci/docs.sh

      - name: Remove one-time migration assets
        run: |
          rm -rf .github/phase21-payload
          rm -f .github/workflows/phase21-migrate.yml

      - name: Commit verified migration
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit --no-verify -m 'refactor(portal): 移除 features 并完成多模板 shadcn 迁移'
          git push origin "HEAD:${HEAD_BRANCH}"
