name: Release Verify

on:
  pull_request:
    branches:
      - mvp

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - mvp

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  RELEASE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/aegisops
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  preflight:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_required: ${{ steps.scope.outputs.release_required }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 2

      - name: Require successful upstream CI
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Upstream CI did not pass."
            exit 1
          fi

      - name: Detect release-relevant changes
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ] \
            || ! git rev-parse HEAD^ >/dev/null 2>&1 \
            || ! git diff --quiet HEAD^ HEAD -- \
              apps modules web contracts deploy scripts infra/checkstyle \
              infra/keycloak infra/docker-compose.yml \
              pom.xml package.json pnpm-lock.yaml pnpm-workspace.yaml \
              .dockerignore .github/workflows/release-verify.yml; then
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.scope.outputs.release_required == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node
        if: steps.scope.outputs.release_required == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Docker Compose
        if: steps.scope.outputs.release_required == 'true'
        uses: docker/setup-compose-action@v2

      - name: Validate release descriptors
        if: steps.scope.outputs.release_required == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/release-preflight.sh 2>&1 | tee release-preflight.log

      - name: Upload release preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-diagnostics
          path: release-preflight.log
          if-no-files-found: warn
          retention-days: 14

  runtime-smoke:
    name: Build, smoke and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight
    env:
      AIOPS_SERVICE_AUTH_BASE_URL: http://keycloak:8080
      AIOPS_SERVICE_AUTH_ISSUER_URI: http://keycloak:8080/realms/aegisops
      AIOPS_SERVICE_AUTH_JWK_SET_URI: http://keycloak:8080/realms/aegisops/protocol/openid-connect/certs
      AIOPS_SERVICE_AUTH_TOKEN_URI: http://keycloak:8080/realms/aegisops/protocol/openid-connect/token
      AIOPS_AGENT_GENERATION_MODE: workflow
      AIOPS_AGENT_WORKFLOW_EVIDENCE_ENABLED: "true"
      AIOPS_AGENT_WORKFLOW_CASE_RETRIEVAL_ENABLED: "false"
      AIOPS_AGENT_WORKFLOW_HUMAN_CHECKPOINT_ENABLED: "false"
      AIOPS_AGENT_WORKFLOW_MULTI_AGENT_ENABLED: "false"
      AIOPS_AGENT_WORKFLOW_MEMORY_ENABLED: "false"
      AIOPS_AGENT_WORKFLOW_MEMORY_WRITE_ENABLED: "false"
    if: needs.preflight.outputs.release_required == 'true'

    steps:
      - name: Generate masked runtime credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          credential_names=(
            AIOPS_KEYCLOAK_ADMIN_PASSWORD
            AIOPS_SERVER_OAUTH2_CLIENT_SECRET
            AIOPS_WORKER_OAUTH2_CLIENT_SECRET
            AIOPS_AGENT_OAUTH2_CLIENT_SECRET
            AIOPS_DIAGNOSIS_GRANT_SECRET
            AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN
          )
          for name in "${credential_names[@]}"; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Build release images once
        run: |
          set -Eeuo pipefail
          docker build \
            --build-arg BUILD_VERSION="${RELEASE_REF}" \
            --file apps/aiops-server/Dockerfile \
            --tag "local/aegisops:${RELEASE_REF}-server" \
            .
          docker build \
            --file apps/aiops-agent/Dockerfile \
            --tag "local/aegisops:${RELEASE_REF}-agent" \
            apps/aiops-agent
          docker build \
            --file deploy/docker/java-app.Dockerfile \
            --build-arg APP_MODULE=apps/aiops-worker \
            --build-arg APP_NAME=aiops-worker \
            --build-arg APP_PORT=8081 \
            --tag "local/aegisops:${RELEASE_REF}-worker" \
            .
          docker build \
            --file apps/aiops-runner/Dockerfile \
            --tag "local/aegisops:${RELEASE_REF}-runner" \
            .

      - name: Start full runtime and verify container health
        env:
          AIOPS_SERVER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-server
          AIOPS_AGENT_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-agent
          AIOPS_WORKER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-worker
          AIOPS_RUNNER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-runner
        run: |
          set -Eeuo pipefail

          compose() {
            docker compose \
              -f deploy/docker-compose.app.yml \
              -f deploy/docker-compose.idp.yml \
              "$@"
          }

          wait_health() {
            local container=$1
            local timeout_seconds=$2
            local elapsed=0
            local status=""

            while [ "$elapsed" -lt "$timeout_seconds" ]; do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  echo "$container healthy after ${elapsed}s"
                  return 0
                  ;;
                unhealthy|exited|dead)
                  echo "$container status=$status" >&2
                  return 1
                  ;;
              esac
              sleep 2
              elapsed=$((elapsed + 2))
            done

            echo "$container did not become healthy within ${timeout_seconds}s (lastStatus=${status:-missing})" >&2
            return 1
          }

          diagnose() {
            compose ps || true
            compose logs --no-color --tail=160 2>&1 \
              | python3 deploy/scripts/redact-runtime-output.py || true
          }
          trap diagnose ERR

          compose up -d --no-build
          wait_health aegisops-postgres 120
          wait_health aegisops-redis 120
          wait_health aegisops-keycloak 180
          wait_health aegisops-agent 120
          wait_health aegisops-server 240
          wait_health aegisops-worker 180
          wait_health aegisops-runner 180
          compose ps

      - name: Verify OAuth2 service trust in both directions
        run: |
          set -o pipefail
          python3 scripts/ci/verify-service-auth-runtime.py 2>&1 \
            | python3 deploy/scripts/redact-runtime-output.py

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified images
        if: github.event_name != 'pull_request'
        run: |
          set -Eeuo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }

          for component in server agent worker runner; do
            local_image="local/aegisops:${RELEASE_REF}-${component}"
            remote_image="${IMAGE_PREFIX}:${IMAGE_TAG}-${component}"
            docker tag "$local_image" "$remote_image"
            retry docker push "$remote_image"
          done

      - name: Capture runtime diagnostics
        if: failure()
        env:
          AIOPS_SERVER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-server
          AIOPS_AGENT_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-agent
          AIOPS_WORKER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-worker
          AIOPS_RUNNER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-runner
          COMPOSE_OVERLAY_FILE: deploy/docker-compose.idp.yml
        run: bash scripts/ci/capture-runtime-diagnostics.sh

      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-runtime-diagnostics
          path: runtime-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup runtime smoke
        if: always()
        env:
          AIOPS_SERVER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-server
          AIOPS_AGENT_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-agent
          AIOPS_WORKER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-worker
          AIOPS_RUNNER_IMAGE: local/aegisops:${{ env.RELEASE_REF }}-runner
        run: >-
          docker compose
          -f deploy/docker-compose.app.yml
          -f deploy/docker-compose.idp.yml
          down --volumes --remove-orphans || true

  deploy:
    name: Deploy to Tencent Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: runtime-smoke
    if: github.event_name != 'pull_request'
    concurrency:
      group: aegisops-prod-deploy
      cancel-in-progress: false
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Prepare candidate deployment descriptor
        run: cp deploy/docker-compose.app.yml deploy/docker-compose.app.candidate.yml

      - name: Copy candidate and deployment tooling
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          source: "deploy/docker-compose.app.candidate.yml,deploy/scripts/deploy-app.sh,deploy/scripts/configure-docker-mirror.sh,deploy/scripts/verify-service-auth-oauth.py,deploy/scripts/redact-runtime-output.py"
          target: "~/workspace/aegisops"
          overwrite: true
          timeout: 10m
          command_timeout: 10m

      - name: Configure Tencent Cloud Docker mirror
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 10m
          script: |
            bash -lc '
              set -Eeuo pipefail
              MIRROR_SCRIPT="$HOME/workspace/aegisops/deploy/scripts/configure-docker-mirror.sh"
              test -f "$MIRROR_SCRIPT"
              chmod +x "$MIRROR_SCRIPT"
              exec bash "$MIRROR_SCRIPT"
            '

      - name: Apply immutable release
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          AIOPS_SERVICE_AUTH_ISSUER_URI: ${{ secrets.AIOPS_SERVICE_AUTH_ISSUER_URI }}
          AIOPS_SERVICE_AUTH_JWK_SET_URI: ${{ secrets.AIOPS_SERVICE_AUTH_JWK_SET_URI }}
          AIOPS_SERVICE_AUTH_TOKEN_URI: ${{ secrets.AIOPS_SERVICE_AUTH_TOKEN_URI }}
          AIOPS_SERVER_OAUTH2_CLIENT_SECRET: ${{ secrets.AIOPS_SERVER_OAUTH2_CLIENT_SECRET }}
          AIOPS_WORKER_OAUTH2_CLIENT_SECRET: ${{ secrets.AIOPS_WORKER_OAUTH2_CLIENT_SECRET }}
          AIOPS_AGENT_OAUTH2_CLIENT_SECRET: ${{ secrets.AIOPS_AGENT_OAUTH2_CLIENT_SECRET }}
          AIOPS_DIAGNOSIS_GRANT_SECRET: ${{ secrets.AIOPS_DIAGNOSIS_GRANT_SECRET }}
          AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN: ${{ secrets.AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN }}
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 20m
          envs: IMAGE_PREFIX,IMAGE_TAG,AIOPS_SERVICE_AUTH_ISSUER_URI,AIOPS_SERVICE_AUTH_JWK_SET_URI,AIOPS_SERVICE_AUTH_TOKEN_URI,AIOPS_SERVER_OAUTH2_CLIENT_SECRET,AIOPS_WORKER_OAUTH2_CLIENT_SECRET,AIOPS_AGENT_OAUTH2_CLIENT_SECRET,AIOPS_DIAGNOSIS_GRANT_SECRET,AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN
          script: |
            bash -lc '
              set -Eeuo pipefail
              APP_DIR="$HOME/workspace/aegisops"
              DEPLOY_SCRIPT="$APP_DIR/deploy/scripts/deploy-app.sh"
              test -f "$DEPLOY_SCRIPT"
              chmod +x "$DEPLOY_SCRIPT"
              export APP_DIR
              exec bash "$DEPLOY_SCRIPT"
            '
