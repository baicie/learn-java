name: Release Verify

on:
  pull_request:
    branches:
      - mvp

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - mvp

  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-verify-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  RELEASE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/aegisops
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  preflight:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_required: ${{ steps.scope.outputs.release_required }}

    steps:
      - name: Authorize release ref and CI
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/mvp" ]; then
              echo "::error::Production release requires refs/heads/mvp."
              exit 1
            fi
            successful_runs="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f "head_sha=$RELEASE_REF" \
              -f branch=mvp \
              -f event=push \
              -f status=success \
              -f per_page=1 \
              --jq '.total_count')"
            if [ "$successful_runs" -lt 1 ]; then
              echo "::error::No successful CI run found for $RELEASE_REF."
              exit 1
            fi
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] \
              || [ "$WORKFLOW_EVENT" != "push" ] \
              || [ "$WORKFLOW_HEAD_BRANCH" != "mvp" ] \
              || [ "$WORKFLOW_CONCLUSION" != "success" ]; then
              echo "::error::Release requires a successful internal mvp push CI workflow run."
              exit 1
            fi
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::error::Unsupported release event: $EVENT_NAME"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 2

      - name: Detect release-relevant changes
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ] \
            || ! git rev-parse HEAD^ >/dev/null 2>&1 \
            || ! git diff --quiet HEAD^ HEAD -- \
              apps modules web contracts deploy scripts \
              infra/checkstyle pom.xml package.json pnpm-lock.yaml pnpm-workspace.yaml \
              .dockerignore .github/workflows/release-verify.yml; then
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.scope.outputs.release_required == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node
        if: steps.scope.outputs.release_required == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Docker Compose
        if: steps.scope.outputs.release_required == 'true'
        uses: docker/setup-compose-action@v2

      - name: Validate release descriptors
        if: steps.scope.outputs.release_required == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/release-preflight.sh 2>&1 | tee release-preflight.log

      - name: Upload release preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-diagnostics
          path: release-preflight.log
          if-no-files-found: warn
          retention-days: 14

  runtime-smoke:
    name: Build, smoke and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight
    if: needs.preflight.outputs.release_required == 'true'
    outputs:
      app_image: ${{ steps.publish.outputs.app_image }}
      agent_image: ${{ steps.publish.outputs.agent_image }}
      runner_image: ${{ steps.publish.outputs.runner_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Build three release images
        env:
          REGISTRY: local
          VERSION: ${{ env.RELEASE_REF }}
        run: bash scripts/deploy/build-images.sh

      - name: Start automation profile and verify internal mTLS
        env:
          AIOPS_APP_IMAGE: local/aegisops-app:${{ env.RELEASE_REF }}
          AIOPS_AGENT_IMAGE: local/aiops-agent:${{ env.RELEASE_REF }}
          AIOPS_RUNNER_IMAGE: local/aiops-runner:${{ env.RELEASE_REF }}
        run: |
          set -Eeuo pipefail
          runtime_dir="$RUNNER_TEMP/aegisops-runtime"
          bash deploy/install.sh \
            --mode automation \
            --runtime-dir "$runtime_dir" \
            --no-start
          bash deploy/scripts/ensure-zabbix-api-network.sh

          compose=(
            docker compose
            --env-file "$runtime_dir/.env"
            -f deploy/docker-compose.core.yml
            --profile ai
            --profile automation
          )

          "${compose[@]}" up -d --wait --remove-orphans --no-build
          "${compose[@]}" exec -T aiops-agent \
            python - \
              --host aegisops-app \
              --port 8443 \
              --server-name aegisops-app \
              --path /actuator/health \
              --cert /run/secrets/agent_tls_cert \
              --key /run/secrets/agent_tls_key \
              --ca /run/secrets/control_plane_ca_cert \
              --expected-spiffe spiffe://aegisops.local/service/aegisops-app \
              < deploy/scripts/verify-internal-mtls.py
          "${compose[@]}" ps

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified images
        id: publish
        if: github.event_name != 'pull_request'
        run: |
          set -Eeuo pipefail

          push_with_digest() {
            local remote_image=$1
            local attempt
            local digest
            local push_output
            for attempt in 1 2 3; do
              if push_output="$(docker push "$remote_image" 2>&1)"; then
                printf '%s\n' "$push_output" >&2
                digest="$(printf '%s\n' "$push_output" | awk '
                  {
                    for (field = 1; field < NF; field++) {
                      if ($field == "digest:") print $(field + 1)
                    }
                  }
                ' | tail -n 1)"
                if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  printf '%s\n' "$digest"
                  return 0
                fi
                echo "Push returned no immutable digest for $remote_image." >&2
              else
                printf '%s\n' "$push_output" >&2
              fi
              [ "$attempt" -lt 3 ] || return 1
              sleep "$((attempt * 10))"
            done
          }

          verify_registry_digest() {
            local digest=$1
            local exact_image="${IMAGE_PREFIX}@${digest}"
            local attempt
            local observed
            for attempt in 1 2 3; do
              observed="$(docker buildx imagetools inspect "$exact_image" 2>/dev/null \
                | awk '$1 == "Digest:" { print $2; exit }')"
              if [ "$observed" = "$digest" ]; then
                return 0
              fi
              [ "$attempt" -lt 3 ] || break
              sleep "$((attempt * 5))"
            done
            echo "Registry did not resolve the pushed digest: $exact_image" >&2
            return 1
          }

          for component in app agent runner; do
            if [ "$component" = "app" ]; then
              local_image="local/aegisops-app:${RELEASE_REF}"
            else
              local_image="local/aiops-${component}:${RELEASE_REF}"
            fi
            remote_image="${IMAGE_PREFIX}:${IMAGE_TAG}-${component}"
            docker tag "$local_image" "$remote_image"
            digest="$(push_with_digest "$remote_image")"
            verify_registry_digest "$digest"
            case "$component" in
              app) printf 'app_image=%s@%s\n' "$IMAGE_PREFIX" "$digest" >> "$GITHUB_OUTPUT" ;;
              agent) printf 'agent_image=%s@%s\n' "$IMAGE_PREFIX" "$digest" >> "$GITHUB_OUTPUT" ;;
              runner) printf 'runner_image=%s@%s\n' "$IMAGE_PREFIX" "$digest" >> "$GITHUB_OUTPUT" ;;
            esac
          done

      - name: Capture runtime diagnostics
        if: failure()
        run: |
          runtime_dir="$RUNNER_TEMP/aegisops-runtime"
          docker compose \
            --env-file "$runtime_dir/.env" \
            -f deploy/docker-compose.core.yml \
            --profile ai \
            --profile automation \
            ps || true
          docker compose \
            --env-file "$runtime_dir/.env" \
            -f deploy/docker-compose.core.yml \
            --profile ai \
            --profile automation \
            logs --no-color --tail=160 2>&1 \
            | python3 deploy/scripts/redact-runtime-output.py \
            > runtime-smoke.log || true

      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-runtime-diagnostics
          path: runtime-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup runtime smoke
        if: always()
        run: |
          runtime_dir="$RUNNER_TEMP/aegisops-runtime"
          if [ -f "$runtime_dir/.env" ]; then
            docker compose \
              --env-file "$runtime_dir/.env" \
              -f deploy/docker-compose.core.yml \
              --profile ai \
              --profile automation \
              down --volumes --remove-orphans || true
          fi

  deploy:
    name: Deploy to Tencent Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: runtime-smoke
    if: github.event_name != 'pull_request'
    concurrency:
      group: aegisops-prod-deploy
      cancel-in-progress: false
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Generate deployment manifest
        run: |
          sha256sum \
            deploy/docker-compose.core.yml \
            deploy/install.sh \
            deploy/init/001-create-roles.sh \
            deploy/init/001-create-roles.sql \
            deploy/init/002-grant-runner.sql \
            deploy/init/003-migrate-legacy-owner.sql \
            deploy/init/004-finalize-legacy-role.sql \
            deploy/scripts/backup-core.sh \
            deploy/scripts/deploy-app.sh \
            deploy/scripts/configure-docker-mirror.sh \
            deploy/scripts/ensure-zabbix-api-network.sh \
            deploy/scripts/migrate-legacy-compose.sh \
            deploy/scripts/promote-deployment-candidate.sh \
            deploy/scripts/restore-core.sh \
            deploy/scripts/verify-internal-mtls.py \
            > deployment-manifest.sha256

      - name: Copy deployment candidate to staging
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          fingerprint: SHA256:t42JX0HGVD6m/KDVHYjoudZQGMv+8B4hkrfGJdZ8axY
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          source: "deployment-manifest.sha256,deploy/docker-compose.core.yml,deploy/install.sh,deploy/init,deploy/scripts/backup-core.sh,deploy/scripts/deploy-app.sh,deploy/scripts/configure-docker-mirror.sh,deploy/scripts/ensure-zabbix-api-network.sh,deploy/scripts/migrate-legacy-compose.sh,deploy/scripts/promote-deployment-candidate.sh,deploy/scripts/restore-core.sh,deploy/scripts/verify-internal-mtls.py"
          target: "~/workspace/aegisops/deploy/staging/app-${{ env.RELEASE_REF }}-${{ github.run_id }}-${{ github.run_attempt }}"
          overwrite: true
          timeout: 10m
          command_timeout: 10m

      - name: Apply staged immutable release
        uses: appleboy/ssh-action@823bd89e131d8d508129f9443cad5855e9ba96f0 # v1.2.4
        env:
          STAGING_ID: app-${{ env.RELEASE_REF }}-${{ github.run_id }}-${{ github.run_attempt }}
          AIOPS_APP_IMAGE: ${{ needs.runtime-smoke.outputs.app_image }}
          AIOPS_AGENT_IMAGE: ${{ needs.runtime-smoke.outputs.agent_image }}
          AIOPS_RUNNER_IMAGE: ${{ needs.runtime-smoke.outputs.runner_image }}
          AIOPS_DEPLOY_MODE: ${{ vars.AIOPS_DEPLOY_MODE || 'diagnostic' }}
          AIOPS_AGENT_OPENAI_API_KEY: ${{ secrets.AIOPS_AGENT_OPENAI_API_KEY }}
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          fingerprint: SHA256:t42JX0HGVD6m/KDVHYjoudZQGMv+8B4hkrfGJdZ8axY
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 20m
          envs: STAGING_ID,AIOPS_APP_IMAGE,AIOPS_AGENT_IMAGE,AIOPS_RUNNER_IMAGE,AIOPS_DEPLOY_MODE,AIOPS_AGENT_OPENAI_API_KEY
          script: |
            bash -lc '
              set -Eeuo pipefail
              APP_DIR="$HOME/workspace/aegisops"
              CANDIDATE_ROOT="$APP_DIR/deploy/staging/$STAGING_ID"
              cd "$CANDIDATE_ROOT"
              sha256sum -c deployment-manifest.sha256
              NETWORK_SCRIPT="$CANDIDATE_ROOT/deploy/scripts/ensure-zabbix-api-network.sh"
              bash -n "$CANDIDATE_ROOT/deploy/install.sh" \
                "$CANDIDATE_ROOT/deploy/scripts/"*.sh
              PROMOTE_SCRIPT="$CANDIDATE_ROOT/deploy/scripts/promote-deployment-candidate.sh"
              PROMOTION_REQUIRE_FLOCK=1 bash "$PROMOTE_SCRIPT" \
                --active-root "$APP_DIR" \
                --recover-only
              bash "$NETWORK_SCRIPT"
              AIOPS_JWT_SECRET=preflight-only \
              AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN=preflight-only \
                docker compose \
                  -f "$CANDIDATE_ROOT/deploy/docker-compose.core.yml" \
                  config --quiet
              predeploy_backup=""
              core_state="$( \
                APP_DIR="$APP_DIR" \
                COMPOSE_FILE="$APP_DIR/deploy/docker-compose.core.yml" \
                bash "$CANDIDATE_ROOT/deploy/scripts/backup-core.sh" --probe-only \
              )"
              if [ "$core_state" = "running" ]; then
                predeploy_backup="$( \
                  APP_DIR="$APP_DIR" \
                  COMPOSE_FILE="$APP_DIR/deploy/docker-compose.core.yml" \
                  bash "$CANDIDATE_ROOT/deploy/scripts/backup-core.sh" \
                )"
                APP_DIR="$APP_DIR" \
                  bash "$CANDIDATE_ROOT/deploy/scripts/backup-core.sh" \
                    --validate "$predeploy_backup" >/dev/null
                echo "Validated pre-promotion Core backup: $predeploy_backup"
              elif [ "$core_state" = "legacy" ]; then
                echo "Supported legacy PostgreSQL detected; the migration path will back it up before modification."
              elif [ "$core_state" != "empty" ]; then
                echo "Unexpected Core state probe result: $core_state" >&2
                exit 1
              fi
              promotion_backup="$(PROMOTION_REQUIRE_FLOCK=1 bash "$PROMOTE_SCRIPT" \
                --candidate-root "$CANDIDATE_ROOT" \
                --active-root "$APP_DIR" \
                --manifest "$CANDIDATE_ROOT/deployment-manifest.sha256" \
                --backup-dir "$APP_DIR/deploy/backups/promotion-$STAGING_ID")"
              echo "Active deployment files backed up at $promotion_backup"
              MIRROR_SCRIPT="$APP_DIR/deploy/scripts/configure-docker-mirror.sh"
              DEPLOY_SCRIPT="$APP_DIR/deploy/scripts/deploy-app.sh"
              chmod +x "$MIRROR_SCRIPT" "$DEPLOY_SCRIPT" "$APP_DIR/deploy/install.sh" \
                "$APP_DIR/deploy/scripts/backup-core.sh" \
                "$APP_DIR/deploy/scripts/restore-core.sh"
              bash "$MIRROR_SCRIPT"
              export APP_DIR
              export CORE_PREDEPLOY_BACKUP_DIR="$predeploy_backup"
              exec bash "$DEPLOY_SCRIPT"
            '
