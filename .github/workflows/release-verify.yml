name: Release Verify

on:
  pull_request:
    branches:
      - mvp
    paths:
      - "apps/**"
      - "modules/**"
      - "web/**"
      - "contracts/**"
      - "deploy/**"
      - "scripts/**"
      - "infra/checkstyle/**"
      - "pom.xml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/release-verify.yml"
      - ".github/workflows/deploy.yml"

  push:
    branches:
      - mvp
      - "fix/**"
    paths:
      - "apps/**"
      - "modules/**"
      - "web/**"
      - "contracts/**"
      - "deploy/**"
      - "scripts/**"
      - "infra/checkstyle/**"
      - "pom.xml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/release-verify.yml"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  preflight:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate release descriptors
        run: |
          set -o pipefail
          bash scripts/ci/release-preflight.sh 2>&1 | tee release-preflight.log

      - name: Upload release preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-preflight-diagnostics
          path: release-preflight.log
          if-no-files-found: error
          retention-days: 14

  container-build:
    name: Container ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: preflight

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aiops-server
            context: .
            dockerfile: ./apps/aiops-server/Dockerfile
            build_args: ""
          - name: aiops-agent
            context: ./apps/aiops-agent
            dockerfile: ./apps/aiops-agent/Dockerfile
            build_args: ""
          - name: aiops-worker
            context: .
            dockerfile: ./deploy/docker/java-app.Dockerfile
            build_args: |
              APP_MODULE=apps/aiops-worker
              APP_NAME=aiops-worker
              APP_PORT=8081
          - name: aiops-runner
            context: .
            dockerfile: ./apps/aiops-runner/Dockerfile
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke-build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  runtime-smoke:
    name: Compose runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: container-build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load aiops-server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/aiops-server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/aegisops:verify-server
          cache-from: type=gha,scope=aiops-server
          provenance: false

      - name: Load aiops-agent image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/aiops-agent
          file: ./apps/aiops-agent/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/aegisops:verify-agent
          cache-from: type=gha,scope=aiops-agent
          provenance: false

      - name: Load aiops-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/java-app.Dockerfile
          build-args: |
            APP_MODULE=apps/aiops-worker
            APP_NAME=aiops-worker
            APP_PORT=8081
          platforms: linux/amd64
          load: true
          tags: local/aegisops:verify-worker
          cache-from: type=gha,scope=aiops-worker
          provenance: false

      - name: Load aiops-runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/aiops-runner/Dockerfile
          platforms: linux/amd64
          load: true
          tags: local/aegisops:verify-runner
          cache-from: type=gha,scope=aiops-runner
          provenance: false

      - name: Start full runtime and verify container health
        env:
          AIOPS_SERVER_IMAGE: local/aegisops:verify-server
          AIOPS_AGENT_IMAGE: local/aegisops:verify-agent
          AIOPS_WORKER_IMAGE: local/aegisops:verify-worker
          AIOPS_RUNNER_IMAGE: local/aegisops:verify-runner
        run: |
          set -Eeuo pipefail

          compose() {
            docker compose -f deploy/docker-compose.app.yml "$@"
          }

          wait_health() {
            local container=$1
            local timeout_seconds=$2
            local elapsed=0
            local status=""

            while [ "$elapsed" -lt "$timeout_seconds" ]; do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)"
              case "$status" in
                healthy)
                  echo "$container healthy after ${elapsed}s"
                  return 0
                  ;;
                unhealthy|exited|dead)
                  echo "$container status=$status" >&2
                  return 1
                  ;;
              esac
              sleep 2
              elapsed=$((elapsed + 2))
            done

            echo "$container did not become healthy within ${timeout_seconds}s (lastStatus=${status:-missing})" >&2
            return 1
          }

          diagnose() {
            compose ps || true
            compose logs --no-color --tail=160 || true
          }
          trap diagnose ERR

          compose up -d --no-build
          wait_health aegisops-postgres 120
          wait_health aegisops-redis 120
          wait_health aegisops-agent 120
          wait_health aegisops-server 240
          wait_health aegisops-worker 180
          wait_health aegisops-runner 180
          compose ps

      - name: Capture runtime diagnostics
        if: failure()
        env:
          AIOPS_SERVER_IMAGE: local/aegisops:verify-server
          AIOPS_AGENT_IMAGE: local/aegisops:verify-agent
          AIOPS_WORKER_IMAGE: local/aegisops:verify-worker
          AIOPS_RUNNER_IMAGE: local/aegisops:verify-runner
        run: bash scripts/ci/capture-runtime-diagnostics.sh

      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-runtime-diagnostics
          path: runtime-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup runtime smoke
        if: always()
        env:
          AIOPS_SERVER_IMAGE: local/aegisops:verify-server
          AIOPS_AGENT_IMAGE: local/aegisops:verify-agent
          AIOPS_WORKER_IMAGE: local/aegisops:verify-worker
          AIOPS_RUNNER_IMAGE: local/aegisops:verify-runner
        run: docker compose -f deploy/docker-compose.app.yml down --volumes --remove-orphans || true
