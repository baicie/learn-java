name: Release Verify

on:
  pull_request:
    branches:
      - mvp

  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - mvp

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"
  RELEASE_REF: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/aegisops
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  preflight:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_required: ${{ steps.scope.outputs.release_required }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 2

      - name: Require successful upstream CI
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Upstream CI did not pass."
            exit 1
          fi

      - name: Detect release-relevant changes
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ] \
            || ! git rev-parse HEAD^ >/dev/null 2>&1 \
            || ! git diff --quiet HEAD^ HEAD -- \
              apps modules web contracts deploy scripts \
              infra/checkstyle pom.xml package.json pnpm-lock.yaml pnpm-workspace.yaml \
              .dockerignore .github/workflows/release-verify.yml; then
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.scope.outputs.release_required == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node
        if: steps.scope.outputs.release_required == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Docker Compose
        if: steps.scope.outputs.release_required == 'true'
        uses: docker/setup-compose-action@v2

      - name: Validate release descriptors
        if: steps.scope.outputs.release_required == 'true'
        run: |
          set -o pipefail
          bash scripts/ci/release-preflight.sh 2>&1 | tee release-preflight.log

      - name: Upload release preflight diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-diagnostics
          path: release-preflight.log
          if-no-files-found: warn
          retention-days: 14

  runtime-smoke:
    name: Build, smoke and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight
    if: needs.preflight.outputs.release_required == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Build three release images
        env:
          REGISTRY: local
          VERSION: ${{ env.RELEASE_REF }}
        run: bash scripts/deploy/build-images.sh

      - name: Start automation profile and verify internal mTLS
        env:
          AIOPS_APP_IMAGE: local/aegisops-app:${{ env.RELEASE_REF }}
          AIOPS_AGENT_IMAGE: local/aiops-agent:${{ env.RELEASE_REF }}
          AIOPS_RUNNER_IMAGE: local/aiops-runner:${{ env.RELEASE_REF }}
        run: |
          set -Eeuo pipefail
          runtime_dir="$RUNNER_TEMP/aegisops-runtime"
          bash deploy/install.sh \
            --mode automation \
            --runtime-dir "$runtime_dir" \
            --no-start

          compose=(
            docker compose
            --env-file "$runtime_dir/.env"
            -f deploy/docker-compose.core.yml
            --profile ai
            --profile automation
          )

          "${compose[@]}" up -d --wait --remove-orphans --no-build
          "${compose[@]}" cp \
            deploy/scripts/verify-internal-mtls.py \
            aiops-agent:/tmp/verify-internal-mtls.py
          "${compose[@]}" exec -T aiops-agent \
            python /tmp/verify-internal-mtls.py \
              --host aegisops-app \
              --port 8443 \
              --server-name aegisops-app \
              --path /actuator/health \
              --cert /run/secrets/agent_tls_cert \
              --key /run/secrets/agent_tls_key \
              --ca /run/secrets/control_plane_ca_cert \
              --expected-spiffe spiffe://aegisops.local/service/aegisops-app
          "${compose[@]}" ps

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified images
        if: github.event_name != 'pull_request'
        run: |
          set -Eeuo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep "$((attempt * 10))"
            done
          }

          for component in app agent runner; do
            if [ "$component" = "app" ]; then
              local_image="local/aegisops-app:${RELEASE_REF}"
            else
              local_image="local/aiops-${component}:${RELEASE_REF}"
            fi
            remote_image="${IMAGE_PREFIX}:${IMAGE_TAG}-${component}"
            docker tag "$local_image" "$remote_image"
            retry docker push "$remote_image"
          done

      - name: Capture runtime diagnostics
        if: failure()
        run: |
          runtime_dir="$RUNNER_TEMP/aegisops-runtime"
          docker compose \
            --env-file "$runtime_dir/.env" \
            -f deploy/docker-compose.core.yml \
            --profile ai \
            --profile automation \
            ps || true
          docker compose \
            --env-file "$runtime_dir/.env" \
            -f deploy/docker-compose.core.yml \
            --profile ai \
            --profile automation \
            logs --no-color --tail=160 2>&1 \
            | python3 deploy/scripts/redact-runtime-output.py \
            > runtime-smoke.log || true

      - name: Upload runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-runtime-diagnostics
          path: runtime-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup runtime smoke
        if: always()
        run: |
          runtime_dir="$RUNNER_TEMP/aegisops-runtime"
          if [ -f "$runtime_dir/.env" ]; then
            docker compose \
              --env-file "$runtime_dir/.env" \
              -f deploy/docker-compose.core.yml \
              --profile ai \
              --profile automation \
              down --volumes --remove-orphans || true
          fi

  deploy:
    name: Deploy to Tencent Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: runtime-smoke
    if: github.event_name != 'pull_request'
    concurrency:
      group: aegisops-prod-deploy
      cancel-in-progress: false
    environment:
      name: aegisops-prod

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Copy deployment tooling
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          source: "deploy/docker-compose.core.yml,deploy/install.sh,deploy/init,deploy/scripts/deploy-app.sh,deploy/scripts/configure-docker-mirror.sh,deploy/scripts/migrate-legacy-compose.sh,deploy/scripts/verify-internal-mtls.py"
          target: "~/workspace/aegisops"
          overwrite: true
          timeout: 10m
          command_timeout: 10m

      - name: Apply immutable release
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          AIOPS_DEPLOY_MODE: ${{ vars.AIOPS_DEPLOY_MODE || 'diagnostic' }}
          AIOPS_AGENT_OPENAI_API_KEY: ${{ secrets.AIOPS_AGENT_OPENAI_API_KEY }}
        with:
          host: ${{ secrets.PERF_VM_HOST }}
          username: ${{ secrets.PERF_VM_USER }}
          key: ${{ secrets.PERF_VM_KEY }}
          password: ${{ secrets.PERF_VM_PASSWORD }}
          port: ${{ secrets.PERF_VM_SSH_PORT || '22' }}
          timeout: 10m
          command_timeout: 20m
          envs: IMAGE_PREFIX,IMAGE_TAG,AIOPS_DEPLOY_MODE,AIOPS_AGENT_OPENAI_API_KEY
          script: |
            bash -lc '
              set -Eeuo pipefail
              APP_DIR="$HOME/workspace/aegisops"
              MIRROR_SCRIPT="$APP_DIR/deploy/scripts/configure-docker-mirror.sh"
              DEPLOY_SCRIPT="$APP_DIR/deploy/scripts/deploy-app.sh"
              test -f "$MIRROR_SCRIPT"
              test -f "$DEPLOY_SCRIPT"
              chmod +x "$MIRROR_SCRIPT" "$DEPLOY_SCRIPT" "$APP_DIR/deploy/install.sh"
              bash "$MIRROR_SCRIPT"
              export APP_DIR
              exec bash "$DEPLOY_SCRIPT"
            '
