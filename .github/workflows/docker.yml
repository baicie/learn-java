name: Docker

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        if: ${{ inputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build aiops-server
        if: ${{ runner.os != 'Windows' && fileExists('apps/aiops-server/Dockerfile') }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "${{ env.IMAGE_PREFIX }}/aiops-server:${{ github.sha }}" \
            -f apps/aiops-server/Dockerfile .

      - name: Build aiops-worker
        if: ${{ runner.os != 'Windows' && fileExists('apps/aiops-worker/Dockerfile') }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "${{ env.IMAGE_PREFIX }}/aiops-worker:${{ github.sha }}" \
            -f apps/aiops-worker/Dockerfile .

      - name: Build aiops-runner
        if: ${{ runner.os != 'Windows' && fileExists('apps/aiops-runner/Dockerfile') }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "${{ env.IMAGE_PREFIX }}/aiops-runner:${{ github.sha }}" \
            -f apps/aiops-runner/Dockerfile .

      - name: No Dockerfiles found
        if: ${{ ! (runner.os != 'Windows' && (fileExists('apps/aiops-server/Dockerfile') || fileExists('apps/aiops-worker/Dockerfile') || fileExists('apps/aiops-runner/Dockerfile'))) }}
        run: |
          echo "No Dockerfiles found. Skipping Docker build."

      - name: Push images
        if: ${{ inputs.push == 'true' }}
        run: |
          set -euo pipefail
          for image in aiops-server aiops-worker aiops-runner; do
            if docker image inspect "${{ env.IMAGE_PREFIX }}/${image}:${{ github.sha }}" > /dev/null 2>&1; then
              docker push "${{ env.IMAGE_PREFIX }}/${image}:${{ github.sha }}"
              echo "Pushed ${{ env.IMAGE_PREFIX }}/${image}:${{ github.sha }}"
            else
              echo "Skip push ${image}: image not built."
            fi
          done
