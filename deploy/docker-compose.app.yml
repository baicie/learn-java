services:
  postgres:
    image: postgres:16
    container_name: aegisops-postgres
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: aegisops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops -d aegisops"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: "${AIOPS_POSTGRES_MEMORY_LIMIT:-384m}"
    mem_reservation: "${AIOPS_POSTGRES_MEMORY_RESERVATION:-192m}"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegisops-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: "${AIOPS_REDIS_MEMORY_LIMIT:-128m}"
    mem_reservation: "${AIOPS_REDIS_MEMORY_RESERVATION:-32m}"
    restart: unless-stopped

  aiops-server:
    image: ${AIOPS_SERVER_IMAGE:?AIOPS_SERVER_IMAGE is required}
    container_name: aegisops-server
    environment:
      AIOPS_SERVICE_AUTH_CONTRACT: oauth2-v1
      JAVA_OPTS: "${AIOPS_SERVER_JAVA_OPTS:--Xms128m -Xmx320m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError}"
      AIOPS_SERVER_PORT: 8080
      AIOPS_DB_URL: jdbc:postgresql://postgres:5432/aegisops
      AIOPS_DB_USERNAME: aegisops
      AIOPS_DB_PASSWORD: aegisops
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AIOPS_JWT_SECRET: ${AIOPS_JWT_SECRET:-dev-secret-change-me-change-me-change-me}
      AIOPS_AGENT_ENABLED: "true"
      AIOPS_INTERNAL_AGENT_API_ENABLED: "true"
      AIOPS_OBJECT_STORAGE_ENABLED: "true"
      AIOPS_REDIS_HEALTH_ENABLED: "true"
      AIOPS_AGENT_BASE_URL: http://aiops-agent:9008
      AIOPS_AGENT_OAUTH2_TOKEN_URI: ${AIOPS_SERVICE_AUTH_TOKEN_URI:?AIOPS_SERVICE_AUTH_TOKEN_URI is required}
      AIOPS_AGENT_OAUTH2_CLIENT_ID: aiops-server
      AIOPS_AGENT_OAUTH2_CLIENT_SECRET: ${AIOPS_SERVER_OAUTH2_CLIENT_SECRET:?AIOPS_SERVER_OAUTH2_CLIENT_SECRET is required}
      AIOPS_AGENT_OAUTH2_SCOPE: "agent:diagnose agent:resume agent:work-record"
      AIOPS_INTERNAL_AGENT_JWT_ISSUER_URI: ${AIOPS_SERVICE_AUTH_ISSUER_URI:?AIOPS_SERVICE_AUTH_ISSUER_URI is required}
      AIOPS_INTERNAL_AGENT_JWT_JWK_SET_URI: ${AIOPS_SERVICE_AUTH_JWK_SET_URI:?AIOPS_SERVICE_AUTH_JWK_SET_URI is required}
      AIOPS_INTERNAL_AGENT_JWT_AUDIENCE: aegisops-internal-api
      AIOPS_DIAGNOSIS_GRANT_SECRET: ${AIOPS_DIAGNOSIS_GRANT_SECRET:?AIOPS_DIAGNOSIS_GRANT_SECRET is required}
      AIOPS_EVIDENCE_VICTORIA_BASE_URL: http://victoriametrics:8428
      AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN: ${AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN:?AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 6
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SERVER_TOMCAT_THREADS_MAX: 50
      SERVER_TOMCAT_THREADS_MIN_SPARE: 4
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aiops-agent:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/actuator/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: "${AIOPS_SERVER_MEMORY_LIMIT:-640m}"
    mem_reservation: "${AIOPS_SERVER_MEMORY_RESERVATION:-384m}"
    restart: unless-stopped

  aiops-agent:
    image: ${AIOPS_AGENT_IMAGE:?AIOPS_AGENT_IMAGE is required}
    container_name: aegisops-agent
    environment:
      AIOPS_SERVICE_AUTH_CONTRACT: oauth2-v1
      AIOPS_AGENT_INBOUND_OAUTH2_ISSUER: ${AIOPS_SERVICE_AUTH_ISSUER_URI:?AIOPS_SERVICE_AUTH_ISSUER_URI is required}
      AIOPS_AGENT_INBOUND_OAUTH2_JWKS_URL: ${AIOPS_SERVICE_AUTH_JWK_SET_URI:?AIOPS_SERVICE_AUTH_JWK_SET_URI is required}
      AIOPS_AGENT_INBOUND_OAUTH2_AUDIENCE: aiops-agent-api
      AIOPS_AGENT_OUTBOUND_OAUTH2_TOKEN_URL: ${AIOPS_SERVICE_AUTH_TOKEN_URI:?AIOPS_SERVICE_AUTH_TOKEN_URI is required}
      AIOPS_AGENT_OUTBOUND_OAUTH2_CLIENT_ID: aiops-agent
      AIOPS_AGENT_OUTBOUND_OAUTH2_CLIENT_SECRET: ${AIOPS_AGENT_OAUTH2_CLIENT_SECRET:?AIOPS_AGENT_OAUTH2_CLIENT_SECRET is required}
      AIOPS_AGENT_OUTBOUND_OAUTH2_SCOPE: "evidence:read cases:read checkpoint:read checkpoint:write memory:read memory:write plugin:authorize"
      AIOPS_AGENT_PROVIDER: aiops-agent
      AIOPS_AGENT_NAME: aegisops_diagnosis_graph
      AIOPS_AGENT_AGENT_NAME: aegisops_diagnosis_graph
      AIOPS_AGENT_CONTRACT_VERSION: agent-diagnosis.v1
      AIOPS_AGENT_GENERATION_MODE: ${AIOPS_AGENT_GENERATION_MODE:-openai-compatible}
      AIOPS_AGENT_MODEL: deepseek-v4-flash
      # Phase4.2 LLM provider
      AIOPS_AGENT_OPENAI_BASE_URL: ${AIOPS_AGENT_OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      AIOPS_AGENT_OPENAI_API_KEY: ${AIOPS_DEEPSEEK_API_KEY:-}
      AIOPS_AGENT_OPENAI_TIMEOUT_SECONDS: 60
      AIOPS_AGENT_OPENAI_TEMPERATURE: 0.2
      AIOPS_AGENT_OPENAI_MAX_TOKENS: 1200
      AIOPS_AGENT_OPENAI_RESPONSE_FORMAT_ENABLED: "true"
      # Phase4.3 evidence tool. Disabled by default to keep local stack self-contained.
      AIOPS_AGENT_EVIDENCE_ENABLED: "false"
      AIOPS_AGENT_EVIDENCE_BASE_URL: http://aiops-server:8080/internal/agent/evidence
      AIOPS_AGENT_EVIDENCE_TIMEOUT_SECONDS: 5
      # Phase4.4 observability. When enabled, response.raw carries agentRun + agentEval.
      AIOPS_AGENT_TRACE_ENABLED: "true"
      AIOPS_AGENT_EVAL_ENABLED: "true"
      # Phase7 canonical workflow. It only queries Java internal APIs and never calls runner.
      AIOPS_AGENT_WORKFLOW_API_BASE_URL: http://aiops-server:8080
      AIOPS_AGENT_WORKFLOW_EVIDENCE_ENABLED: ${AIOPS_AGENT_WORKFLOW_EVIDENCE_ENABLED:-true}
      AIOPS_AGENT_WORKFLOW_CASE_RETRIEVAL_ENABLED: ${AIOPS_AGENT_WORKFLOW_CASE_RETRIEVAL_ENABLED:-true}
      AIOPS_AGENT_WORKFLOW_HUMAN_CHECKPOINT_ENABLED: ${AIOPS_AGENT_WORKFLOW_HUMAN_CHECKPOINT_ENABLED:-false}
      AIOPS_AGENT_WORKFLOW_MULTI_AGENT_ENABLED: ${AIOPS_AGENT_WORKFLOW_MULTI_AGENT_ENABLED:-false}
      AIOPS_AGENT_WORKFLOW_MEMORY_ENABLED: ${AIOPS_AGENT_WORKFLOW_MEMORY_ENABLED:-true}
      AIOPS_AGENT_WORKFLOW_MEMORY_WRITE_ENABLED: ${AIOPS_AGENT_WORKFLOW_MEMORY_WRITE_ENABLED:-false}
      # Dify is optional; secrets are injected only into aiops-agent.
      AIOPS_AGENT_WORK_RECORD_PROVIDER: ${AIOPS_AGENT_WORK_RECORD_PROVIDER:-deterministic}
      AIOPS_AGENT_DIFY_BASE_URL: ${AIOPS_AGENT_DIFY_BASE_URL:-https://dify.example.com/v1}
      AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY: ${AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY:-}
      AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_ID: ${AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_ID:-}
      AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_VERSION: ${AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_VERSION:-work-record-2026-07-19.1}
      AIOPS_AGENT_DIFY_TIMEOUT_SECONDS: ${AIOPS_AGENT_DIFY_TIMEOUT_SECONDS:-75}
      AIOPS_AGENT_DIFY_MAX_RETRIES: ${AIOPS_AGENT_DIFY_MAX_RETRIES:-2}
      AIOPS_AGENT_DIFY_MAX_INPUT_BYTES: ${AIOPS_AGENT_DIFY_MAX_INPUT_BYTES:-65536}
      AIOPS_AGENT_DIFY_USER_HMAC_SECRET: ${AIOPS_AGENT_DIFY_USER_HMAC_SECRET:-}
    ports:
      - "9008:9008"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9008/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: "${AIOPS_AGENT_MEMORY_LIMIT:-256m}"
    mem_reservation: "${AIOPS_AGENT_MEMORY_RESERVATION:-96m}"
    restart: unless-stopped

  # Worker: 异步消费 outbox + 跑 Incident 聚合 / RCA / Zabbix sync / 复盘草稿。
  # 共享 server 同一 Postgres；不暴露给外部。
  aiops-worker:
    image: ${AIOPS_WORKER_IMAGE:?AIOPS_WORKER_IMAGE is required}
    container_name: aegisops-worker
    environment:
      AIOPS_SERVICE_AUTH_CONTRACT: oauth2-v1
      JAVA_OPTS: "${AIOPS_WORKER_JAVA_OPTS:--Xms96m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError}"
      AIOPS_DB_URL: jdbc:postgresql://postgres:5432/aegisops
      AIOPS_DB_USER: aegisops
      AIOPS_DB_PASSWORD: aegisops
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AIOPS_WORKER_PORT: 8081
      AIOPS_OUTBOX_ENABLED: "true"
      AIOPS_OUTBOX_POLL_MS: 5000
      AIOPS_OUTBOX_BATCH: 10
      AIOPS_OUTBOX_TARGET_APP: worker
      AIOPS_RUNTIME_PHASE: ${AIOPS_RUNTIME_PHASE:-phase5}
      AIOPS_AGENT_ENABLED: "true"
      AIOPS_INTERNAL_AGENT_API_ENABLED: "false"
      AIOPS_OBJECT_STORAGE_ENABLED: "true"
      AIOPS_REDIS_HEALTH_ENABLED: "true"
      AIOPS_AGENT_BASE_URL: http://aiops-agent:9008
      AIOPS_AGENT_OAUTH2_TOKEN_URI: ${AIOPS_SERVICE_AUTH_TOKEN_URI:?AIOPS_SERVICE_AUTH_TOKEN_URI is required}
      AIOPS_AGENT_OAUTH2_CLIENT_ID: aiops-worker
      AIOPS_AGENT_OAUTH2_CLIENT_SECRET: ${AIOPS_WORKER_OAUTH2_CLIENT_SECRET:?AIOPS_WORKER_OAUTH2_CLIENT_SECRET is required}
      AIOPS_AGENT_OAUTH2_SCOPE: "agent:diagnose agent:work-record"
      AIOPS_INTERNAL_AGENT_JWT_ISSUER_URI: ${AIOPS_SERVICE_AUTH_ISSUER_URI:?AIOPS_SERVICE_AUTH_ISSUER_URI is required}
      AIOPS_INTERNAL_AGENT_JWT_JWK_SET_URI: ${AIOPS_SERVICE_AUTH_JWK_SET_URI:?AIOPS_SERVICE_AUTH_JWK_SET_URI is required}
      AIOPS_INTERNAL_AGENT_JWT_AUDIENCE: aegisops-internal-api
      AIOPS_DIAGNOSIS_GRANT_SECRET: ${AIOPS_DIAGNOSIS_GRANT_SECRET:?AIOPS_DIAGNOSIS_GRANT_SECRET is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 6
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SERVER_TOMCAT_THREADS_MAX: 24
      SERVER_TOMCAT_THREADS_MIN_SPARE: 2
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aiops-agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8081/actuator/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: "${AIOPS_WORKER_MEMORY_LIMIT:-576m}"
    mem_reservation: "${AIOPS_WORKER_MEMORY_RESERVATION:-320m}"
    restart: unless-stopped

  # Runner: 隔离执行 ansible / webhook 步骤；MVP 阶段跑在同主机，但作为独立进程保证故障隔离。
  # 跑 ansible 需要 sshpass + openssh-client，基础镜像里已装。
  aiops-runner:
    image: ${AIOPS_RUNNER_IMAGE:?AIOPS_RUNNER_IMAGE is required}
    container_name: aegisops-runner
    environment:
      JAVA_OPTS: "${AIOPS_RUNNER_JAVA_OPTS:--Xms64m -Xmx192m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=64m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError}"
      AIOPS_DB_URL: jdbc:postgresql://postgres:5432/aegisops
      AIOPS_DB_USERNAME: aegisops
      AIOPS_DB_PASSWORD: aegisops
      AIOPS_RUNNER_PORT: 8092
      AIOPS_RUNNER_ID: ${AIOPS_RUNNER_ID:-prod-runner-1}
      AIOPS_RUNNER_POLL_MS: 5000
      AIOPS_RUNNER_SWEEP_MS: 10000
      AIOPS_RUNNER_MAX_PER_TICK: 1
      AIOPS_RUNNER_SWEEP_LIMIT: 20
      AIOPS_RUNNER_ANSIBLE_CHECK_ENABLED: "true"
      AIOPS_RUNNER_ANSIBLE_BINARY: ansible-playbook
      AIOPS_RUNNER_ANSIBLE_WORKSPACE_ROOT: .runtime/ansible/workspaces
      AIOPS_RUNNER_ANSIBLE_RESOURCE_ROOT: .runtime/ansible/resources
      AIOPS_RUNNER_ANSIBLE_CLEANUP_WORKSPACE: "true"
      AIOPS_EXECUTION_LEASE_SECONDS: 60
      AIOPS_EXECUTION_RUN_TIMEOUT_SECONDS: 1800
      AIOPS_EXECUTION_STEP_TIMEOUT_SECONDS: 300
      AIOPS_EXECUTION_MAX_RETRY_ATTEMPTS: 3
      AIOPS_RUNTIME_PHASE: ${AIOPS_RUNTIME_PHASE:-phase5}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 6
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      SERVER_TOMCAT_THREADS_MAX: 24
      SERVER_TOMCAT_THREADS_MIN_SPARE: 2
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8092/actuator/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    # tmpfs 隔离 ansible workspace，避免宿主机目录权限问题
    tmpfs:
      - /app/.runtime:size=512m,mode=1777
    mem_limit: "${AIOPS_RUNNER_MEMORY_LIMIT:-512m}"
    mem_reservation: "${AIOPS_RUNNER_MEMORY_RESERVATION:-256m}"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
