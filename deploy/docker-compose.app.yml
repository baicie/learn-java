services:
  aiops-server:
    build:
      context: ..
      dockerfile: apps/aiops-server/Dockerfile
    container_name: aegisops-server
    environment:
      AIOPS_SERVER_PORT: 8080
      AIOPS_DB_URL: jdbc:postgresql://postgres:5432/aegisops
      AIOPS_DB_USERNAME: aegisops
      AIOPS_DB_PASSWORD: aegisops
      AIOPS_JWT_SECRET: ${AIOPS_JWT_SECRET:-dev-secret-change-me-change-me-change-me}
      AIOPS_AGENT_BASE_URL: http://aiops-agent:9008
      AIOPS_AGENT_INTERNAL_TOKEN: dev-internal-agent-token
      AIOPS_EVIDENCE_VICTORIA_BASE_URL: http://victoriametrics:8428
      AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN: dev-zabbix-webhook-token
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      aiops-agent:
        condition: service_started
    restart: unless-stopped
