services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    container_name: aegisops-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AIOPS_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AIOPS_KEYCLOAK_ADMIN_PASSWORD:-runtime-smoke-admin}
      KC_HOSTNAME: ${AIOPS_SERVICE_AUTH_BASE_URL:-http://keycloak:8080}
      KC_HEALTH_ENABLED: "true"
      AIOPS_SERVER_OAUTH2_CLIENT_SECRET: ${AIOPS_SERVER_OAUTH2_CLIENT_SECRET:?AIOPS_SERVER_OAUTH2_CLIENT_SECRET is required}
      AIOPS_WORKER_OAUTH2_CLIENT_SECRET: ${AIOPS_WORKER_OAUTH2_CLIENT_SECRET:?AIOPS_WORKER_OAUTH2_CLIENT_SECRET is required}
      AIOPS_AGENT_OAUTH2_CLIENT_SECRET: ${AIOPS_AGENT_OAUTH2_CLIENT_SECRET:?AIOPS_AGENT_OAUTH2_CLIENT_SECRET is required}
    volumes:
      - ../infra/keycloak/aegisops-realm.json:/opt/keycloak/data/import/aegisops-realm.json:ro
    ports:
      - "8089:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-ec",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: "${AIOPS_KEYCLOAK_MEMORY_LIMIT:-512m}"
    mem_reservation: "${AIOPS_KEYCLOAK_MEMORY_RESERVATION:-256m}"
    restart: unless-stopped
