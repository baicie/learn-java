apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.fullname" . }}-secret
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIOPS_DB_PASSWORD: {{ required "external.postgres.password is required" .Values.external.postgres.password | quote }}
  POSTGRES_PASSWORD: {{ required "external.postgres.password is required" .Values.external.postgres.password | quote }}

  REDIS_PASSWORD: {{ .Values.external.redis.password | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.external.clickhouse.password | quote }}
  AIOPS_MINIO_ACCESS_KEY: {{ .Values.external.minio.accessKey | quote }}
  AIOPS_MINIO_SECRET_KEY: {{ .Values.external.minio.secretKey | quote }}
{{- if eq .Values.dify.workRecordProvider "dify" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.fullname" . }}-agent-dify
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY: {{ required "dify.workRecordApiKey is required when Dify is enabled" .Values.dify.workRecordApiKey | quote }}
  AIOPS_AGENT_DIFY_USER_HMAC_SECRET: {{ required "dify.userHmacSecret is required when Dify is enabled" .Values.dify.userHmacSecret | quote }}
{{- end }}
