{{- if .Values.serviceMesh.istio.enabled }}
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: {{ include "aegisops.fullname" . }}-strict-mtls
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
  mtls:
    mode: STRICT
{{- if .Values.apps.agent.enabled }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-agent
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" .Release.Namespace (include "aegisops.componentServiceAccountName" (list . "server")) | quote }}
              - {{ printf "cluster.local/ns/%s/sa/%s" .Release.Namespace (include "aegisops.componentServiceAccountName" (list . "worker")) | quote }}
      to:
        - operation:
            methods:
              - POST
            paths:
              - /v1/auth/probe
              - /v1/diagnose
              - /v1/diagnose/*
              - /v1/work-record/generate
    - to:
        - operation:
            methods:
              - GET
            paths:
              - /health
              - /metrics
{{- end }}
{{- if .Values.apps.server.enabled }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-server
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  action: ALLOW
  rules:
    - to:
        - operation:
            notPaths:
              - /internal/agent/*
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" .Release.Namespace (include "aegisops.componentServiceAccountName" (list . "agent")) | quote }}
      to:
        - operation:
            paths:
              - /internal/agent/*
{{- end }}
{{- end }}
