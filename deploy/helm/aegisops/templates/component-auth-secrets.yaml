{{- define "aegisops.requiredDiagnosisGrantSecret" -}}
{{- $secret := required "security.diagnosisGrantSecret is required" .Values.security.diagnosisGrantSecret -}}
{{- if lt (len $secret) 32 -}}
{{- fail "security.diagnosisGrantSecret must contain at least 32 bytes" -}}
{{- end -}}
{{- $secret -}}
{{- end -}}
{{- if or .Values.apps.server.enabled .Values.apps.worker.enabled -}}
{{- $ttl := int .Values.security.diagnosisGrantTtlSeconds -}}
{{- if or (lt $ttl 1) (gt $ttl 300) -}}
{{- fail "security.diagnosisGrantTtlSeconds must be between 1 and 300" -}}
{{- end -}}
{{- end -}}
{{- define "aegisops.validateOAuthClientSecrets" -}}
{{- $root := . -}}
{{- $seen := dict -}}
{{- range $component := list "server" "worker" "agent" -}}
{{- $app := index $root.Values.apps $component -}}
{{- if $app.enabled -}}
{{- $client := index $root.Values.security.serviceAuth.clients $component -}}
{{- $secret := required (printf "security.serviceAuth.clients.%s.clientSecret is required" $component) (index $client "clientSecret") -}}
{{- if hasKey $seen $secret -}}
{{- fail (printf "OAuth2 client secrets must be distinct: %s and %s share a secret" (index $seen $secret) $component) -}}
{{- end -}}
{{- $_ := set $seen $secret $component -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- include "aegisops.validateOAuthClientSecrets" . -}}
{{- define "aegisops.serverAuthSecretData" -}}
{{- $auth := .Values.security.serviceAuth -}}
AIOPS_DIAGNOSIS_GRANT_SECRET: {{ include "aegisops.requiredDiagnosisGrantSecret" . | quote }}
AIOPS_AGENT_OAUTH2_CLIENT_SECRET: {{ required "security.serviceAuth.clients.server.clientSecret is required" $auth.clients.server.clientSecret | quote }}
{{- end -}}
{{- define "aegisops.workerAuthSecretData" -}}
{{- $auth := .Values.security.serviceAuth -}}
AIOPS_DIAGNOSIS_GRANT_SECRET: {{ include "aegisops.requiredDiagnosisGrantSecret" . | quote }}
AIOPS_AGENT_OAUTH2_CLIENT_SECRET: {{ required "security.serviceAuth.clients.worker.clientSecret is required" $auth.clients.worker.clientSecret | quote }}
{{- end -}}
{{- define "aegisops.agentAuthSecretData" -}}
{{- $auth := .Values.security.serviceAuth -}}
AIOPS_AGENT_OUTBOUND_OAUTH2_CLIENT_SECRET: {{ required "security.serviceAuth.clients.agent.clientSecret is required" $auth.clients.agent.clientSecret | quote }}
{{- end -}}
{{- if .Values.apps.server.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.fullname" . }}-server-auth
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
{{ include "aegisops.serverAuthSecretData" . | nindent 2 }}
{{- end }}
{{- if .Values.apps.worker.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.fullname" . }}-worker-auth
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
stringData:
{{ include "aegisops.workerAuthSecretData" . | nindent 2 }}
{{- end }}
{{- if .Values.apps.agent.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.fullname" . }}-agent-auth
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
stringData:
{{ include "aegisops.agentAuthSecretData" . | nindent 2 }}
{{- end }}
