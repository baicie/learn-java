{{- $root := . -}}
{{- $auth := .Values.security.serviceAuth -}}
{{- if .Values.apps.server.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.fullname" . }}-server-auth
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  AIOPS_DIAGNOSIS_GRANT_SECRET: {{ required "security.diagnosisGrantSecret is required" .Values.security.diagnosisGrantSecret | quote }}
  {{- if eq $auth.mode "oauth2" }}
  AIOPS_AGENT_OAUTH2_CLIENT_SECRET: {{ required "security.serviceAuth.clients.server.clientSecret is required" $auth.clients.server.clientSecret | quote }}
  {{- else }}
  AIOPS_AGENT_INTERNAL_TOKEN: {{ required "security.serviceAuth.staticJavaToAgentToken is required" $auth.staticJavaToAgentToken | quote }}
  AIOPS_INTERNAL_AGENT_TOKEN: {{ required "security.serviceAuth.staticAgentToJavaToken is required" $auth.staticAgentToJavaToken | quote }}
  {{- end }}
{{- end }}
{{- if .Values.apps.worker.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.fullname" . }}-worker-auth
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
stringData:
  AIOPS_DIAGNOSIS_GRANT_SECRET: {{ required "security.diagnosisGrantSecret is required" .Values.security.diagnosisGrantSecret | quote }}
  {{- if eq $auth.mode "oauth2" }}
  AIOPS_AGENT_OAUTH2_CLIENT_SECRET: {{ required "security.serviceAuth.clients.worker.clientSecret is required" $auth.clients.worker.clientSecret | quote }}
  {{- else }}
  AIOPS_AGENT_INTERNAL_TOKEN: {{ required "security.serviceAuth.staticJavaToAgentToken is required" $auth.staticJavaToAgentToken | quote }}
  {{- end }}
{{- end }}
{{- if .Values.apps.agent.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.fullname" . }}-agent-auth
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
stringData:
  {{- if eq $auth.mode "oauth2" }}
  AIOPS_AGENT_OUTBOUND_OAUTH2_CLIENT_SECRET: {{ required "security.serviceAuth.clients.agent.clientSecret is required" $auth.clients.agent.clientSecret | quote }}
  {{- else }}
  AIOPS_AGENT_INTERNAL_AGENT_TOKEN: {{ required "security.serviceAuth.staticJavaToAgentToken is required" $auth.staticJavaToAgentToken | quote }}
  AIOPS_AGENT_OUTBOUND_STATIC_TOKEN: {{ required "security.serviceAuth.staticAgentToJavaToken is required" $auth.staticAgentToJavaToken | quote }}
  {{- end }}
{{- end }}
