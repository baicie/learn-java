{{- if and .Values.apps.app.enabled (empty .Values.security.existingSecrets.app) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.componentSecretName" (list . "app") }}
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
type: Opaque
stringData:
  AIOPS_DB_PASSWORD: {{ required "external.postgres.appPassword is required when app Secret is managed by the chart" .Values.external.postgres.appPassword | quote }}
  AIOPS_JWT_SECRET: {{ required "security.jwtSecret is required when app Secret is managed by the chart" .Values.security.jwtSecret | quote }}
  AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN: {{ required "security.zabbixWebhookSigningSecret is required when app Secret is managed by the chart" .Values.security.zabbixWebhookSigningSecret | quote }}
  app.crt: {{ required "security.mtls.appCertificate is required when app Secret is managed by the chart" .Values.security.mtls.appCertificate | quote }}
  app.key: {{ required "security.mtls.appPrivateKey is required when app Secret is managed by the chart" .Values.security.mtls.appPrivateKey | quote }}
  agent-ca.crt: {{ required "security.mtls.agentCaCertificate is required when app Secret is managed by the chart" .Values.security.mtls.agentCaCertificate | quote }}
  grant-private.pem: {{ required "security.taskGrant.privateKey is required when app Secret is managed by the chart" .Values.security.taskGrant.privateKey | quote }}
  grant-public.pem: {{ required "security.taskGrant.publicKey is required when app Secret is managed by the chart" .Values.security.taskGrant.publicKey | quote }}
{{ if .Values.security.taskGrant.previousKeyId }}
  grant-previous-public.pem: {{ required "security.taskGrant.previousPublicKey is required when previousKeyId is configured" .Values.security.taskGrant.previousPublicKey | quote }}
{{ end }}
{{ if .Values.features.objectStorageEnabled }}
  AIOPS_MINIO_ACCESS_KEY: {{ required "external.minio.accessKey is required when object storage is enabled" .Values.external.minio.accessKey | quote }}
  AIOPS_MINIO_SECRET_KEY: {{ required "external.minio.secretKey is required when object storage is enabled" .Values.external.minio.secretKey | quote }}
{{ end }}
{{- end }}
{{- if and .Values.apps.agent.enabled (empty .Values.security.existingSecrets.agent) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.componentSecretName" (list . "agent") }}
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
stringData:
  agent.crt: {{ required "security.mtls.agentCertificate is required when agent Secret is managed by the chart" .Values.security.mtls.agentCertificate | quote }}
  agent.key: {{ required "security.mtls.agentPrivateKey is required when agent Secret is managed by the chart" .Values.security.mtls.agentPrivateKey | quote }}
  control-plane-ca.crt: {{ required "security.mtls.controlPlaneCaCertificate is required when agent Secret is managed by the chart" .Values.security.mtls.controlPlaneCaCertificate | quote }}
  grant-public.pem: {{ required "security.taskGrant.publicKey is required when agent Secret is managed by the chart" .Values.security.taskGrant.publicKey | quote }}
{{ if .Values.security.taskGrant.previousKeyId }}
  grant-previous-public.pem: {{ required "security.taskGrant.previousPublicKey is required when previousKeyId is configured" .Values.security.taskGrant.previousPublicKey | quote }}
{{ end }}
{{ if eq .Values.dify.workRecordProvider "dify" }}
  AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY: {{ required "dify.workRecordApiKey is required when Dify is enabled" .Values.dify.workRecordApiKey | quote }}
  AIOPS_AGENT_DIFY_USER_HMAC_SECRET: {{ required "dify.userHmacSecret is required when Dify is enabled" .Values.dify.userHmacSecret | quote }}
{{ end }}
{{- end }}
{{- if and .Values.apps.runner.enabled (empty .Values.security.existingSecrets.runner) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisops.componentSecretName" (list . "runner") }}
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
type: Opaque
stringData:
  AIOPS_DB_PASSWORD: {{ required "external.postgres.runnerPassword is required when runner Secret is managed by the chart" .Values.external.postgres.runnerPassword | quote }}
  grant-public.pem: {{ required "security.taskGrant.publicKey is required when runner Secret is managed by the chart" .Values.security.taskGrant.publicKey | quote }}
{{ if .Values.security.taskGrant.previousKeyId }}
  grant-previous-public.pem: {{ required "security.taskGrant.previousPublicKey is required when previousKeyId is configured" .Values.security.taskGrant.previousPublicKey | quote }}
{{ end }}
{{- end }}
