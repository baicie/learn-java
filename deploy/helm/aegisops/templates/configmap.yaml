apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisops.fullname" . }}-config
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}
  JAVA_OPTS: {{ .Values.config.javaOpts | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TZ: {{ .Values.global.timezone | quote }}
  AIOPS_AGENT_BASE_URL: "https://{{ include "aegisops.fullname" . }}-agent:{{ .Values.apps.agent.port }}"
  AIOPS_AGENT_WORKFLOW_API_BASE_URL: "https://{{ include "aegisops.fullname" . }}-app:{{ .Values.apps.app.internalMtlsPort }}"
  AIOPS_AGENT_EVIDENCE_BASE_URL: "https://{{ include "aegisops.fullname" . }}-app:{{ .Values.apps.app.internalMtlsPort }}/internal/agent/evidence"
  AIOPS_PUBLIC_API_RPM: {{ .Values.security.publicApiRequestsPerMinute | quote }}
  AIOPS_INTERNAL_AGENT_RPM: {{ .Values.security.internalAgentRequestsPerMinute | quote }}
  AIOPS_TENANT_REQUIRED: {{ .Values.security.tenantRequired | quote }}
  AIOPS_OBJECT_STORAGE_ENABLED: {{ .Values.features.objectStorageEnabled | quote }}
  AIOPS_EVIDENCE_VICTORIA_ENABLED: {{ .Values.features.victoriaMetricsEnabled | quote }}
  AIOPS_EVIDENCE_VICTORIA_BASE_URL: {{ .Values.external.victoriaMetrics.baseUrl | quote }}
  AIOPS_REDIS_HEALTH_ENABLED: {{ .Values.features.redisHealthEnabled | quote }}
  AIOPS_QUOTA_BACKEND: {{ .Values.features.quotaBackend | quote }}
  AIOPS_MINIO_ENDPOINT: {{ .Values.external.minio.endpoint | quote }}
  AIOPS_MINIO_BUCKET: {{ .Values.external.minio.bucket | quote }}
  AIOPS_MINIO_REGION: {{ .Values.external.minio.region | quote }}
  AIOPS_OBSERVABILITY_ENABLED: {{ .Values.observability.enabled | quote }}
  AIOPS_HTTP_METRICS_ENABLED: {{ .Values.observability.metrics.enabled | quote }}
  AIOPS_AGENT_OBSERVABILITY_ENABLED: {{ .Values.observability.enabled | quote }}
  AIOPS_AGENT_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisops.fullname" . }}-agent-config
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
data:
  AIOPS_AGENT_WORK_RECORD_PROVIDER: {{ .Values.dify.workRecordProvider | quote }}
  AIOPS_AGENT_DIFY_BASE_URL: {{ .Values.dify.baseUrl | quote }}
  AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_ID: {{ .Values.dify.workRecordWorkflowId | quote }}
  AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_VERSION: {{ .Values.dify.workRecordWorkflowVersion | quote }}
  AIOPS_AGENT_DIFY_TIMEOUT_SECONDS: {{ .Values.dify.timeoutSeconds | quote }}
  AIOPS_AGENT_DIFY_MAX_RETRIES: {{ .Values.dify.maxRetries | quote }}
  AIOPS_AGENT_DIFY_MAX_INPUT_BYTES: {{ .Values.dify.maxInputBytes | quote }}
