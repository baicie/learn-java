{{- if .Values.networkPolicy.enabled }}
{{- include "aegisops.validateIngressNamespaceSelector" . }}
{{- include "aegisops.validateNetworkPolicyEgressCidrs" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-default-deny
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- if .Values.apps.app.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-app-ingress
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.apps.app.port }}
    {{- if .Values.apps.agent.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: {{ .Values.apps.app.internalMtlsPort }}
    {{- end }}
{{- end }}
{{- if .Values.apps.agent.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" . }}-agent-ingress
  labels:
    {{- include "aegisops.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.apps.app.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: {{ .Values.apps.agent.port }}
    {{- else }}
    []
    {{- end }}
{{- end }}
{{- $root := . }}
{{- range $component := list "app" "agent" "runner" }}
{{- $app := index $root.Values.apps $component }}
{{- if $app.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisops.fullname" $root }}-{{ $component }}-egress
  labels:
    {{- include "aegisops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisops.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml $root.Values.networkPolicy.egress.dnsNamespaceSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if and (eq $component "app") $root.Values.apps.agent.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: agent
      ports:
        - protocol: TCP
          port: {{ $root.Values.apps.agent.port }}
    {{- end }}
    {{- if and (eq $component "agent") $root.Values.apps.app.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisops.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: app
      ports:
        - protocol: TCP
          port: {{ $root.Values.apps.app.internalMtlsPort }}
    {{- end }}
    - to:
        {{- range $cidr := $root.Values.networkPolicy.egress.allowedCidrs }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
        {{- end }}
      ports:
        {{- range $port := index $root.Values.networkPolicy.egress.externalPorts $component }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
