{{- include "aegisops.validateComponentServiceAccounts" . -}}
{{- $root := . -}}
{{- $auth := .Values.security.serviceAuth -}}
{{- range $appName, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisops.fullname" $root }}-{{ $appName }}
  labels:
    {{- include "aegisops.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $appName }}
spec:
  replicas: {{ $app.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegisops.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $appName }}
  template:
    metadata:
      labels:
        {{- include "aegisops.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $appName }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $root | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $root | sha256sum }}
        {{- if eq $appName "server" }}
        checksum/server-secret: {{ include (print $.Template.BasePath "/server-secret.yaml") $root | sha256sum }}
        {{- end }}
        {{- if or (eq $appName "server") (eq $appName "worker") (eq $appName "agent") }}
        checksum/component-auth-secret: {{ include (printf "aegisops.%sAuthSecretData" $appName) $root | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aegisops.componentServiceAccountName" (list $root $appName) }}
      imagePullSecrets:
        {{- toYaml $root.Values.global.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $appName }}
          image: {{ include "aegisops.image" (list $root $app.image) | quote }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          envFrom:
            - configMapRef:
                name: {{ include "aegisops.fullname" $root }}-config
            {{- if ne $appName "agent" }}
            - secretRef:
                name: {{ include "aegisops.fullname" $root }}-secret
            {{- end }}
            {{- if or (eq $appName "server") (eq $appName "worker") (eq $appName "agent") }}
            - secretRef:
                name: {{ include "aegisops.fullname" $root }}-{{ $appName }}-auth
            {{- end }}
            {{- if eq $appName "agent" }}
            - configMapRef:
                name: {{ include "aegisops.fullname" $root }}-agent-dify
            {{- end }}
          env:
            - name: AIOPS_APP_NAME
              value: {{ $appName | quote }}
            {{- if eq $appName "server" }}
            - name: AIOPS_AGENT_ENABLED
              value: {{ $root.Values.apps.agent.enabled | quote }}
            - name: AIOPS_INTERNAL_AGENT_API_ENABLED
              value: {{ $root.Values.apps.agent.enabled | quote }}
            - name: AIOPS_OBJECT_STORAGE_ENABLED
              value: "true"
            - name: AIOPS_REDIS_HEALTH_ENABLED
              value: "true"
            - name: AIOPS_INTERNAL_AGENT_JWT_ISSUER_URI
              value: {{ required "security.serviceAuth.issuerUri is required" $auth.issuerUri | quote }}
            - name: AIOPS_INTERNAL_AGENT_JWT_JWK_SET_URI
              value: {{ required "security.serviceAuth.jwkSetUri is required" $auth.jwkSetUri | quote }}
            - name: AIOPS_INTERNAL_AGENT_JWT_AUDIENCE
              value: {{ $auth.internalAudience | quote }}
            - name: AIOPS_AGENT_OAUTH2_TOKEN_URI
              value: {{ required "security.serviceAuth.tokenUri is required" $auth.tokenUri | quote }}
            - name: AIOPS_AGENT_OAUTH2_CLIENT_ID
              value: {{ required "security.serviceAuth.clients.server.clientId is required" $auth.clients.server.clientId | quote }}
            - name: AIOPS_AGENT_OAUTH2_SCOPE
              value: {{ $auth.clients.server.scope | quote }}
            - name: AIOPS_DIAGNOSIS_GRANT_AUDIENCE
              value: {{ $auth.internalAudience | quote }}
            - name: AIOPS_AGENT_GRANT_ISSUER
              value: "aiops-server"
            - name: AIOPS_DIAGNOSIS_GRANT_TTL_SECONDS
              value: {{ $root.Values.security.diagnosisGrantTtlSeconds | quote }}
            - name: AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegisops.fullname" $root }}-server-secret
                  key: AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN
            {{- end }}
            {{- if eq $appName "worker" }}
            - name: AIOPS_AGENT_ENABLED
              value: {{ $root.Values.apps.agent.enabled | quote }}
            - name: AIOPS_INTERNAL_AGENT_API_ENABLED
              value: "false"
            - name: AIOPS_OBJECT_STORAGE_ENABLED
              value: "true"
            - name: AIOPS_REDIS_HEALTH_ENABLED
              value: "true"
            - name: AIOPS_INTERNAL_AGENT_JWT_ISSUER_URI
              value: {{ required "security.serviceAuth.issuerUri is required" $auth.issuerUri | quote }}
            - name: AIOPS_INTERNAL_AGENT_JWT_JWK_SET_URI
              value: {{ required "security.serviceAuth.jwkSetUri is required" $auth.jwkSetUri | quote }}
            - name: AIOPS_INTERNAL_AGENT_JWT_AUDIENCE
              value: {{ $auth.internalAudience | quote }}
            - name: AIOPS_AGENT_OAUTH2_TOKEN_URI
              value: {{ required "security.serviceAuth.tokenUri is required" $auth.tokenUri | quote }}
            - name: AIOPS_AGENT_OAUTH2_CLIENT_ID
              value: {{ required "security.serviceAuth.clients.worker.clientId is required" $auth.clients.worker.clientId | quote }}
            - name: AIOPS_AGENT_OAUTH2_SCOPE
              value: {{ $auth.clients.worker.scope | quote }}
            - name: AIOPS_DIAGNOSIS_GRANT_AUDIENCE
              value: {{ $auth.internalAudience | quote }}
            - name: AIOPS_AGENT_GRANT_ISSUER
              value: "aiops-worker"
            - name: AIOPS_DIAGNOSIS_GRANT_TTL_SECONDS
              value: {{ $root.Values.security.diagnosisGrantTtlSeconds | quote }}
            {{- end }}
            {{- if eq $appName "agent" }}
            - name: AIOPS_AGENT_INBOUND_OAUTH2_ISSUER
              value: {{ required "security.serviceAuth.issuerUri is required" $auth.issuerUri | quote }}
            - name: AIOPS_AGENT_INBOUND_OAUTH2_JWKS_URL
              value: {{ required "security.serviceAuth.jwkSetUri is required" $auth.jwkSetUri | quote }}
            - name: AIOPS_AGENT_INBOUND_OAUTH2_AUDIENCE
              value: {{ $auth.agentAudience | quote }}
            - name: AIOPS_AGENT_OUTBOUND_OAUTH2_TOKEN_URL
              value: {{ required "security.serviceAuth.tokenUri is required" $auth.tokenUri | quote }}
            - name: AIOPS_AGENT_OUTBOUND_OAUTH2_CLIENT_ID
              value: {{ required "security.serviceAuth.clients.agent.clientId is required" $auth.clients.agent.clientId | quote }}
            - name: AIOPS_AGENT_OUTBOUND_OAUTH2_SCOPE
              value: {{ $auth.clients.agent.scope | quote }}
            {{- end }}
            {{- if and (eq $appName "agent") (eq $root.Values.dify.workRecordProvider "dify") }}
            - name: AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegisops.fullname" $root }}-agent-dify
                  key: AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY
            - name: AIOPS_AGENT_DIFY_USER_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aegisops.fullname" $root }}-agent-dify
                  key: AIOPS_AGENT_DIFY_USER_HMAC_SECRET
            {{- end }}
            {{- range $key, $value := $app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ ternary "/health" "/actuator/health" (eq $appName "agent") }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ ternary "/health" "/actuator/health" (eq $appName "agent") }}
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml $app.resources | nindent 12 }}
{{- end }}
{{- end }}
