global:
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  storageClass: ""
  timezone: UTC

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

commonLabels: {}
commonAnnotations: {}

config:
  springProfilesActive: private
  javaOpts: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
  logLevel: INFO

security:
  internalAgentToken: ""
  jwtSecret: ""
  internalAgentTokenRequired: true
  tenantRequired: true
  publicApiRequestsPerMinute: 600
  internalAgentRequestsPerMinute: 1200

external:
  postgres:
    host: "postgresql.default.svc.cluster.local"
    port: 5432
    database: "aegisops"
    username: "aegisops"
    password: ""
  redis:
    host: "redis.default.svc.cluster.local"
    port: 6379
    password: ""
  clickhouse:
    host: "clickhouse.default.svc.cluster.local"
    httpPort: 8123
    tcpPort: 9000
    database: "aegisops"
    username: "default"
    password: ""
  minio:
    endpoint: "http://minio.default.svc.cluster.local:9000"
    accessKey: ""
    secretKey: ""
    bucket: "aegisops"
  victoriaMetrics:
    baseUrl: "http://victoria-metrics.default.svc.cluster.local:8428"

apps:
  server:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-server"
      tag: "0.1.0"
    port: 8080
    env: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  worker:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-worker"
      tag: "0.1.0"
    port: 8081
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
  runner:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-runner"
      tag: "0.1.0"
    port: 8092
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
  agent:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-agent"
      tag: "0.1.0"
    port: 8000
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aegisops.local
      paths:
        - path: /
          pathType: Prefix
          service: server
          port: 8080
  tls: []

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
  egressEnabled: true

offline:
  enabled: false
