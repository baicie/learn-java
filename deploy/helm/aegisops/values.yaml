global:
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  storageClass: ""
  timezone: UTC

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # When create=false, all four names are required, must be distinct, and cannot be "default".
  names: {}
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

commonLabels: {}
commonAnnotations: {}

config:
  springProfilesActive: private
  javaOpts: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
  logLevel: INFO

security:
  jwtSecret: ""
  zabbixWebhookSigningSecret: ""
  diagnosisGrantSecret: ""
  diagnosisGrantTtlSeconds: 300
  tenantRequired: true
  publicApiRequestsPerMinute: 600
  internalAgentRequestsPerMinute: 1200
  serviceAuth:
    issuerUri: ""
    jwkSetUri: ""
    tokenUri: ""
    agentAudience: aiops-agent-api
    internalAudience: aegisops-internal-api
    clients:
      server:
        clientId: aiops-server
        clientSecret: ""
        scope: "agent:diagnose agent:resume agent:work-record"
      worker:
        clientId: aiops-worker
        clientSecret: ""
        scope: "agent:diagnose agent:work-record"
      agent:
        clientId: aiops-agent
        clientSecret: ""
        scope: "evidence:read cases:read checkpoint:read checkpoint:write memory:read memory:write plugin:authorize"

dify:
  workRecordProvider: deterministic
  baseUrl: "https://dify.example.com/v1"
  workRecordApiKey: ""
  workRecordWorkflowId: ""
  workRecordWorkflowVersion: "work-record-2026-07-19.1"
  timeoutSeconds: 75
  maxRetries: 2
  maxInputBytes: 65536
  userHmacSecret: ""

external:
  postgres:
    host: "postgresql.default.svc.cluster.local"
    port: 5432
    database: "aegisops"
    username: "aegisops"
    password: ""
  redis:
    host: "redis.default.svc.cluster.local"
    port: 6379
    password: ""
  clickhouse:
    host: "clickhouse.default.svc.cluster.local"
    httpPort: 8123
    tcpPort: 9000
    database: "aegisops"
    username: "default"
    password: ""
  minio:
    endpoint: "http://minio.default.svc.cluster.local:9000"
    accessKey: ""
    secretKey: ""
    bucket: "aegisops"
    region: "us-east-1"
  victoriaMetrics:
    baseUrl: "http://victoria-metrics.default.svc.cluster.local:8428"

apps:
  server:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-server"
      tag: "0.1.0"
    port: 8080
    env: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  worker:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-worker"
      tag: "0.1.0"
    port: 8081
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
  runner:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-runner"
      tag: "0.1.0"
    port: 8092
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
  agent:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-agent"
      tag: "0.1.0"
    port: 9008
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aegisops.local
      paths:
        - path: /
          pathType: Prefix
          service: server
          port: 8080
  tls: []

networkPolicy:
  enabled: false
  # Override this selector when the ingress controller runs in another namespace.
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  egress:
    dnsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    # Standard NetworkPolicy cannot match DNS names. When enabled, explicitly set restricted
    # CIDRs for the IdP and external data services; world-open CIDRs are rejected.
    allowedCidrs: []
    externalPorts:
      server:
        - 443
        - 5432
        - 6379
      worker:
        - 80
        - 443
        - 5432
        - 6379
        - 8123
        - 8428
        - 9000
      runner:
        - 22
        - 80
        - 443
        - 5432
        - 6379
        - 9000
      agent:
        - 443

serviceMesh:
  istio:
    enabled: false

offline:
  enabled: false

observability:
  enabled: true
  metrics:
    enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
