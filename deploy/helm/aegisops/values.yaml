global:
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  storageClass: ""
  timezone: UTC

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # When create=false, enabled components need distinct non-default names.
  names: {}
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

commonLabels: {}
commonAnnotations: {}

config:
  springProfilesActive: private
  javaOpts: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
  logLevel: INFO

security:
  jwtSecret: ""
  zabbixWebhookSigningSecret: ""
  diagnosisGrantTtlSeconds: 300
  tenantRequired: true
  publicApiRequestsPerMinute: 600
  internalAgentRequestsPerMinute: 1200
  existingSecrets:
    app: ""
    agent: ""
    runner: ""
  taskGrant:
    keyId: task-grant-v1
    privateKey: ""
    publicKey: ""
    previousKeyId: ""
    previousPublicKey: ""
    executionQueueWaitSeconds: 1800
  mtls:
    appCertificate: ""
    appPrivateKey: ""
    controlPlaneCaCertificate: ""
    agentCertificate: ""
    agentPrivateKey: ""
    agentCaCertificate: ""

dify:
  workRecordProvider: deterministic
  baseUrl: "https://dify.example.com/v1"
  workRecordApiKey: ""
  workRecordWorkflowId: ""
  workRecordWorkflowVersion: "work-record-2026-08-13.1"
  timeoutSeconds: 75
  maxRetries: 2
  maxInputBytes: 65536
  userHmacSecret: ""

external:
  postgres:
    host: "postgresql.default.svc.cluster.local"
    port: 5432
    database: "aegisops"
    appUsername: "aegisops_app"
    appPassword: ""
    runnerUsername: "aegisops_runner"
    runnerPassword: ""
  minio:
    endpoint: "http://minio.default.svc.cluster.local:9000"
    accessKey: ""
    secretKey: ""
    bucket: "aegisops"
    region: "us-east-1"
  victoriaMetrics:
    baseUrl: "http://victoria-metrics.default.svc.cluster.local:8428"

features:
  objectStorageEnabled: false
  victoriaMetricsEnabled: false
  redisHealthEnabled: false
  quotaBackend: memory

apps:
  app:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aegisops-app"
      tag: "0.1.0"
    port: 8080
    internalMtlsPort: 8443
    env: {}
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
  agent:
    enabled: true
    replicaCount: 1
    image:
      repository: "aegisops/aiops-agent"
      tag: "0.1.0"
    port: 9008
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  runner:
    enabled: false
    replicaCount: 1
    image:
      repository: "aegisops/aiops-runner"
      tag: "0.1.0"
    port: 8092
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aegisops.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  egress:
    dnsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    # Standard NetworkPolicy cannot match DNS names. Production profiles must set
    # restricted CIDRs for PostgreSQL, model providers and execution targets.
    allowedCidrs: []
    externalPorts:
      app:
        - 80
        - 443
        - 5432
      agent:
        - 443
      runner:
        - 22
        - 80
        - 443
        - 5432

serviceMesh:
  istio:
    enabled: false

offline:
  enabled: false

observability:
  enabled: true
  metrics:
    enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
