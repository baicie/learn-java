global:
  imageRegistry: "registry.local/aegisops"
  imagePullPolicy: IfNotPresent

offline:
  enabled: true

security:
  existingSecrets:
    app: aegisops-app-security
    agent: aegisops-agent-security
    runner: aegisops-runner-security

apps:
  app:
    image:
      repository: "aegisops-app"
      tag: "0.1.0"
  agent:
    image:
      repository: "aiops-agent"
      tag: "0.1.0"
  runner:
    image:
      repository: "aiops-runner"
      tag: "0.1.0"

ingress:
  enabled: false

networkPolicy:
  # Enable after setting networkPolicy.egress.allowedCidrs for this cluster.
  enabled: false
