global:
  imageRegistry: "registry.local/aegisops"
  imagePullPolicy: IfNotPresent

offline:
  enabled: true

security:
  jwtSecret: "CHANGE_ME_JWT_SECRET"
  zabbixWebhookSigningSecret: ""
  diagnosisGrantSecret: "CHANGE_ME_DIAGNOSIS_GRANT_SECRET"
  serviceAuth:
    mode: oauth2
    issuerUri: "https://keycloak.aegisops.local/realms/aegisops"
    jwkSetUri: "https://keycloak.aegisops.local/realms/aegisops/protocol/openid-connect/certs"
    tokenUri: "https://keycloak.aegisops.local/realms/aegisops/protocol/openid-connect/token"
    clients:
      server:
        clientId: aiops-server
        clientSecret: "CHANGE_ME_SERVER_CLIENT_SECRET"
      worker:
        clientId: aiops-worker
        clientSecret: "CHANGE_ME_WORKER_CLIENT_SECRET"
      agent:
        clientId: aiops-agent
        clientSecret: "CHANGE_ME_AGENT_CLIENT_SECRET"

apps:
  server:
    image:
      repository: "aiops-server"
      tag: "0.1.0"
  worker:
    image:
      repository: "aiops-worker"
      tag: "0.1.0"
  runner:
    image:
      repository: "aiops-runner"
      tag: "0.1.0"
  agent:
    image:
      repository: "aiops-agent"
      tag: "0.1.0"

ingress:
  enabled: false
