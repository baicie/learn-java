global:
  imagePullPolicy: IfNotPresent

config:
  springProfilesActive: private
  logLevel: INFO

security:
  existingSecrets:
    app: aegisops-app-security
    agent: aegisops-agent-security
    runner: aegisops-runner-security

external:
  postgres:
    host: "postgresql.aegisops-infra.svc.cluster.local"
    port: 5432
    database: "aegisops"
    appUsername: "aegisops_app"
    appPassword: ""
    runnerUsername: "aegisops_runner"
    runnerPassword: ""
  minio:
    endpoint: "http://minio.aegisops-infra.svc.cluster.local:9000"
    accessKey: ""
    secretKey: ""
    region: "us-east-1"
    bucket: "aegisops"
  victoriaMetrics:
    baseUrl: "http://victoria-metrics.aegisops-infra.svc.cluster.local:8428"

apps:
  app:
    replicaCount: 2
  agent:
    replicaCount: 2
  runner:
    replicaCount: 1

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: aegisops.example.local
      paths:
        - path: /
          pathType: Prefix

networkPolicy:
  # Enable after setting networkPolicy.egress.allowedCidrs for this cluster.
  enabled: false
