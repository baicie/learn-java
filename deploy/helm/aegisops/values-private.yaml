global:
  imagePullPolicy: IfNotPresent

config:
  springProfilesActive: private
  logLevel: INFO

security:
  jwtSecret: "CHANGE_ME_JWT_SECRET"
  zabbixWebhookSigningSecret: ""
  diagnosisGrantSecret: ""
  serviceAuth:
    issuerUri: "https://keycloak.example.com/realms/aegisops"
    jwkSetUri: "https://keycloak.example.com/realms/aegisops/protocol/openid-connect/certs"
    tokenUri: "https://keycloak.example.com/realms/aegisops/protocol/openid-connect/token"
    clients:
      server:
        clientId: aiops-server
        clientSecret: ""
      worker:
        clientId: aiops-worker
        clientSecret: ""
      agent:
        clientId: aiops-agent
        clientSecret: ""

external:
  postgres:
    host: "postgresql.aegisops-infra.svc.cluster.local"
    port: 5432
    database: "aegisops"
    username: "aegisops"
    password: "CHANGE_ME_POSTGRES_PASSWORD"
  redis:
    host: "redis.aegisops-infra.svc.cluster.local"
    port: 6379
    password: "CHANGE_ME_REDIS_PASSWORD"
  clickhouse:
    host: "clickhouse.aegisops-infra.svc.cluster.local"
    httpPort: 8123
    tcpPort: 9000
    database: "aegisops"
    username: "default"
    password: "CHANGE_ME_CLICKHOUSE_PASSWORD"
  minio:
    endpoint: "http://minio.aegisops-infra.svc.cluster.local:9000"
    accessKey: "CHANGE_ME_MINIO_ACCESS_KEY"
    secretKey: "CHANGE_ME_MINIO_SECRET_KEY"
    region: "us-east-1"
    bucket: "aegisops"
  victoriaMetrics:
    baseUrl: "http://victoria-metrics.aegisops-infra.svc.cluster.local:8428"

apps:
  server:
    replicaCount: 2
  worker:
    replicaCount: 1
  runner:
    replicaCount: 1
  agent:
    replicaCount: 2

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: aegisops.example.local
      paths:
        - path: /
          pathType: Prefix
          service: server
          port: 8080

networkPolicy:
  enabled: true
