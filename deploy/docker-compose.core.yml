name: aegisops

x-app-database-environment: &app-database-environment
  AIOPS_DB_URL: jdbc:postgresql://postgres:5432/aegisops
  AIOPS_DB_USERNAME: aegisops_app

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: aegisops-postgres
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - app_db_password
      - runner_db_password
    volumes:
      - core_postgres_data:/var/lib/postgresql/data
      - ./init/001-create-roles.sh:/docker-entrypoint-initdb.d/001-create-roles.sh:ro
      - ./init/001-create-roles.sql:/opt/aegisops/init/001-create-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops_admin -d aegisops"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-db
      - runner-db
    restart: unless-stopped

  aegisops-app:
    image: ${AIOPS_APP_IMAGE:-aegisops/aegisops-app:0.1.0}
    container_name: aegisops-app
    build:
      context: ..
      dockerfile: apps/aiops-server/Dockerfile
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export AIOPS_DB_PASSWORD="$$(cat /run/secrets/app_db_password)";
        exec java $$JAVA_OPTS -jar /app/app.jar
    environment:
      <<: *app-database-environment
      AIOPS_APP_NAME: aegisops-app
      AIOPS_SERVER_PORT: 8080
      AIOPS_RUNTIME_PHASE: ${AIOPS_RUNTIME_PHASE:-phase6}
      AIOPS_JWT_SECRET: ${AIOPS_JWT_SECRET:?set AIOPS_JWT_SECRET in the generated env file}
      AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN: ${AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN:?set AIOPS_INTEGRATIONS_ZABBIX_WEBHOOK_TOKEN in the generated env file}
      AIOPS_AGENT_ENABLED: ${AIOPS_AGENT_ENABLED:-false}
      AIOPS_INTERNAL_AGENT_API_ENABLED: ${AIOPS_INTERNAL_AGENT_API_ENABLED:-false}
      AIOPS_AGENT_BASE_URL: https://aiops-agent:9008
      AIOPS_AGENT_SSL_BUNDLE_NAME: agentclient
      SPRING_SSL_BUNDLE_PEM_AGENTCLIENT_KEYSTORE_CERTIFICATE: /run/secrets/app_tls_cert
      SPRING_SSL_BUNDLE_PEM_AGENTCLIENT_KEYSTORE_PRIVATE_KEY: /run/secrets/app_tls_key
      SPRING_SSL_BUNDLE_PEM_AGENTCLIENT_TRUSTSTORE_CERTIFICATE: /run/secrets/agent_ca_cert
      AIOPS_INTERNAL_MTLS_PORT: 8443
      AIOPS_TLS_CERT_FILE: /run/secrets/app_tls_cert
      AIOPS_TLS_KEY_FILE: /run/secrets/app_tls_key
      AIOPS_TLS_CLIENT_CA_FILE: /run/secrets/agent_ca_cert
      AIOPS_INTERNAL_AGENT_CERTIFICATE_IDENTITIES: spiffe://aegisops.local/service/aiops-agent
      AIOPS_DIAGNOSIS_GRANT_PUBLIC_KEY_FILE: /run/secrets/task_grant_public_key
      AIOPS_DIAGNOSIS_GRANT_AUDIENCE: aegisops-internal-api
      AIOPS_DIAGNOSIS_GRANT_ISSUERS: aegisops-app
      AIOPS_AGENT_GRANT_ISSUER: aegisops-app
      AIOPS_DIAGNOSIS_GRANT_AUDIENCES: aiops-agent-api,aegisops-internal-api
      AIOPS_DIAGNOSIS_GRANT_KEY_ID: ${AIOPS_TASK_GRANT_KEY_ID:-task-grant-v1}
      AIOPS_DIAGNOSIS_GRANT_PREVIOUS_KEY_ID: ${AIOPS_TASK_GRANT_PREVIOUS_KEY_ID:-}
      AIOPS_DIAGNOSIS_GRANT_PREVIOUS_PUBLIC_KEY_FILE: ${AIOPS_TASK_GRANT_PREVIOUS_PUBLIC_KEY_FILE:-}
      AIOPS_DIAGNOSIS_GRANT_PRIVATE_KEY_FILE: /run/secrets/task_grant_private_key
      AIOPS_DIAGNOSIS_GRANT_TTL_SECONDS: 300
      AIOPS_EXECUTION_GRANT_ISSUER: aegisops-app
      AIOPS_EXECUTION_GRANT_AUDIENCE: aiops-runner
      AIOPS_EXECUTION_GRANT_SCOPE: runbook:execute
      AIOPS_EXECUTION_GRANT_KEY_ID: ${AIOPS_TASK_GRANT_KEY_ID:-task-grant-v1}
      AIOPS_EXECUTION_GRANT_PRIVATE_KEY_FILE: /run/secrets/task_grant_private_key
      AIOPS_OBJECT_STORAGE_ENABLED: ${AIOPS_OBJECT_STORAGE_ENABLED:-false}
      AIOPS_EVIDENCE_VICTORIA_ENABLED: ${AIOPS_EVIDENCE_VICTORIA_ENABLED:-false}
      AIOPS_QUOTA_BACKEND: ${AIOPS_QUOTA_BACKEND:-memory}
      AIOPS_REDIS_HEALTH_ENABLED: ${AIOPS_REDIS_HEALTH_ENABLED:-false}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${AIOPS_APP_DB_POOL_MAX:-10}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${AIOPS_APP_DB_POOL_MIN_IDLE:-2}
    secrets:
      - app_db_password
      - app_tls_cert
      - app_tls_key
      - agent_ca_cert
      - task_grant_private_key
      - task_grant_public_key
      - task_grant_previous_public_key
    ports:
      - "${AIOPS_APP_PORT:-8080}:8080"
    expose:
      - 8443
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - frontend
      - app-db
      - app-agent
      - zabbix-api
    tmpfs:
      - /tmp:size=128m,mode=1777
    restart: unless-stopped

  aiops-agent:
    profiles: ["ai"]
    image: ${AIOPS_AGENT_IMAGE:-aegisops/aiops-agent:0.1.0}
    container_name: aegisops-agent
    build:
      context: ../apps/aiops-agent
      dockerfile: Dockerfile
    environment:
      AIOPS_AGENT_GENERATION_MODE: ${AIOPS_AGENT_GENERATION_MODE:-workflow}
      AIOPS_AGENT_OPENAI_BASE_URL: ${AIOPS_AGENT_OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      AIOPS_AGENT_OPENAI_API_KEY: ${AIOPS_AGENT_OPENAI_API_KEY:-}
      AIOPS_AGENT_WORKFLOW_API_BASE_URL: https://aegisops-app:8443
      AIOPS_AGENT_EVIDENCE_BASE_URL: https://aegisops-app:8443/internal/agent/evidence
      AIOPS_AGENT_WORK_RECORD_PROVIDER: ${AIOPS_AGENT_WORK_RECORD_PROVIDER:-deterministic}
      AIOPS_AGENT_DIFY_BASE_URL: ${AIOPS_AGENT_DIFY_BASE_URL:-}
      AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY: ${AIOPS_AGENT_DIFY_WORK_RECORD_API_KEY:-}
      AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_ID: ${AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_ID:-}
      AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_VERSION: ${AIOPS_AGENT_DIFY_WORK_RECORD_WORKFLOW_VERSION:-}
      AIOPS_AGENT_DIFY_USER_HMAC_SECRET: ${AIOPS_AGENT_DIFY_USER_HMAC_SECRET:-}
      AIOPS_AGENT_TLS_CERTIFICATE_FILE: /run/secrets/agent_tls_cert
      AIOPS_AGENT_TLS_PRIVATE_KEY_FILE: /run/secrets/agent_tls_key
      AIOPS_AGENT_TLS_CLIENT_CA_FILE: /run/secrets/control_plane_ca_cert
      AIOPS_AGENT_DIAGNOSIS_GRANT_ISSUER: aegisops-app
      AIOPS_AGENT_DIAGNOSIS_GRANT_AUDIENCE: aiops-agent-api
      AIOPS_AGENT_DIAGNOSIS_GRANT_KEY_ID: ${AIOPS_TASK_GRANT_KEY_ID:-task-grant-v1}
      AIOPS_AGENT_DIAGNOSIS_GRANT_PUBLIC_KEY_FILE: /run/secrets/task_grant_public_key
      AIOPS_AGENT_DIAGNOSIS_GRANT_PREVIOUS_KEY_ID: ${AIOPS_TASK_GRANT_PREVIOUS_KEY_ID:-}
      AIOPS_AGENT_DIAGNOSIS_GRANT_PREVIOUS_PUBLIC_KEY_FILE: ${AIOPS_TASK_GRANT_PREVIOUS_PUBLIC_KEY_FILE:-}
    secrets:
      - agent_tls_cert
      - agent_tls_key
      - control_plane_ca_cert
      - task_grant_public_key
      - task_grant_previous_public_key
    expose:
      - 9008
    depends_on:
      aegisops-app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 9008), 3); s.close()"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - app-agent
      - agent-egress
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    restart: unless-stopped

  runner-db-permissions:
    profiles: ["automation"]
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: aegisops
      PGUSER: aegisops_admin
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export PGPASSWORD="$$(cat /run/secrets/postgres_admin_password)";
        exec psql --set=ON_ERROR_STOP=1 --file=/opt/aegisops/init/002-grant-runner.sql
    secrets:
      - postgres_admin_password
    volumes:
      - ./init/002-grant-runner.sql:/opt/aegisops/init/002-grant-runner.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      aegisops-app:
        condition: service_healthy
    networks:
      - runner-db
    restart: "no"

  aiops-runner:
    profiles: ["automation"]
    image: ${AIOPS_RUNNER_IMAGE:-aegisops/aiops-runner:0.1.0}
    container_name: aegisops-runner
    build:
      context: ..
      dockerfile: apps/aiops-runner/Dockerfile
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "-ec"]
    command:
      - >-
        export AIOPS_DB_PASSWORD="$$(cat /run/secrets/runner_db_password)";
        exec java $$JAVA_OPTS -jar /app/app.jar
    environment:
      AIOPS_DB_URL: jdbc:postgresql://postgres:5432/aegisops
      AIOPS_DB_USERNAME: aegisops_runner
      AIOPS_RUNNER_PORT: 8092
      AIOPS_RUNTIME_PHASE: ${AIOPS_RUNTIME_PHASE:-phase6}
      AIOPS_RUNNER_ID: ${AIOPS_RUNNER_ID:-compose-runner-1}
      AIOPS_RUNNER_EXECUTION_GRANT_ISSUER: aegisops-app
      AIOPS_RUNNER_EXECUTION_GRANT_AUDIENCE: aiops-runner
      AIOPS_RUNNER_EXECUTION_GRANT_SCOPE: runbook:execute
      AIOPS_RUNNER_EXECUTION_GRANT_CURRENT_KEY_ID: ${AIOPS_TASK_GRANT_KEY_ID:-task-grant-v1}
      AIOPS_RUNNER_EXECUTION_GRANT_CURRENT_PUBLIC_KEY_FILE: /run/secrets/task_grant_public_key
      AIOPS_RUNNER_EXECUTION_GRANT_PREVIOUS_KEY_ID: ${AIOPS_TASK_GRANT_PREVIOUS_KEY_ID:-}
      AIOPS_RUNNER_EXECUTION_GRANT_PREVIOUS_PUBLIC_KEY_FILE: ${AIOPS_TASK_GRANT_PREVIOUS_PUBLIC_KEY_FILE:-}
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${AIOPS_RUNNER_DB_POOL_MAX:-4}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${AIOPS_RUNNER_DB_POOL_MIN_IDLE:-1}
    secrets:
      - runner_db_password
      - task_grant_public_key
      - task_grant_previous_public_key
    depends_on:
      postgres:
        condition: service_healthy
      runner-db-permissions:
        condition: service_completed_successfully
    networks:
      - runner-db
      - runner-egress
    read_only: true
    tmpfs:
      - /app/.runtime:size=512m,mode=1777
      - /tmp:size=128m,mode=1777
    restart: unless-stopped

networks:
  frontend:
  app-db:
    internal: true
  app-agent:
    internal: true
  runner-db:
    internal: true
  agent-egress: {}
  runner-egress: {}
  zabbix-api:
    external: true
    name: aegisops-zabbix-api

volumes:
  core_postgres_data:
    name: ${AIOPS_POSTGRES_VOLUME_NAME:-aegisops_postgres_data}

secrets:
  postgres_admin_password:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/postgres_admin_password
  app_db_password:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/app_db_password
  runner_db_password:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/runner_db_password
  control_plane_ca_cert:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/control_plane_ca.crt
  agent_ca_cert:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/agent_ca.crt
  app_tls_cert:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/app.crt
  app_tls_key:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/app.key
  agent_tls_cert:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/agent.crt
  agent_tls_key:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/agent.key
  task_grant_private_key:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/grant-private.pem
  task_grant_public_key:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/grant-public.pem
  task_grant_previous_public_key:
    file: ${AIOPS_SECRETS_DIR:-./runtime/secrets}/grant-previous-public.pem
