name: aegisops-core

x-database-environment: &database-environment
  AIOPS_DB_URL: jdbc:postgresql://postgres:5432/aegisops
  AIOPS_DB_USERNAME: aegisops
  AIOPS_DB_USER: aegisops
  AIOPS_DB_PASSWORD: ${AIOPS_DB_PASSWORD:-aegisops}

x-core-feature-environment: &core-feature-environment
  AIOPS_AGENT_ENABLED: ${AIOPS_AGENT_ENABLED:-false}
  AIOPS_INTERNAL_AGENT_API_ENABLED: ${AIOPS_INTERNAL_AGENT_API_ENABLED:-false}
  AIOPS_OBJECT_STORAGE_ENABLED: ${AIOPS_OBJECT_STORAGE_ENABLED:-false}
  AIOPS_EVIDENCE_VICTORIA_ENABLED: ${AIOPS_EVIDENCE_VICTORIA_ENABLED:-false}
  AIOPS_QUOTA_BACKEND: ${AIOPS_QUOTA_BACKEND:-memory}
  AIOPS_REDIS_HEALTH_ENABLED: ${AIOPS_REDIS_HEALTH_ENABLED:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegisops
      POSTGRES_USER: aegisops
      POSTGRES_PASSWORD: ${AIOPS_DB_PASSWORD:-aegisops}
    ports:
      - "${AIOPS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisops -d aegisops"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  aiops-server:
    image: ${AIOPS_SERVER_IMAGE:-aegisops/aiops-server:0.1.0}
    build:
      context: ..
      dockerfile: apps/aiops-server/Dockerfile
    environment:
      <<: [*database-environment, *core-feature-environment]
      AIOPS_SERVER_PORT: 8080
      AIOPS_RUNTIME_PHASE: ${AIOPS_RUNTIME_PHASE:-phase5}
      AIOPS_JWT_SECRET: ${AIOPS_JWT_SECRET:-dev-secret-change-me-change-me-change-me}
      AIOPS_AGENT_BASE_URL: http://aiops-agent:9008
      AIOPS_AGENT_OAUTH2_TOKEN_URI: http://keycloak:8080/realms/aegisops/protocol/openid-connect/token
      AIOPS_AGENT_OAUTH2_CLIENT_ID: aiops-server
      AIOPS_AGENT_OAUTH2_CLIENT_SECRET: ${AIOPS_SERVER_OAUTH2_CLIENT_SECRET:-dev-aiops-server-client-secret}
      AIOPS_INTERNAL_AGENT_JWT_ISSUER_URI: http://localhost:8089/realms/aegisops
      AIOPS_INTERNAL_AGENT_JWT_JWK_SET_URI: http://keycloak:8080/realms/aegisops/protocol/openid-connect/certs
      AIOPS_DIAGNOSIS_GRANT_SECRET: ${AIOPS_DIAGNOSIS_GRANT_SECRET:-dev-diagnosis-grant-secret-change-me}
      AIOPS_MINIO_ENDPOINT: http://minio:9000
      AIOPS_MINIO_ACCESS_KEY: ${AIOPS_MINIO_ACCESS_KEY:-minioadmin}
      AIOPS_MINIO_SECRET_KEY: ${AIOPS_MINIO_SECRET_KEY:-minioadmin}
      AIOPS_MINIO_BUCKET: ${AIOPS_MINIO_BUCKET:-aegisops-work-record}
      AIOPS_EVIDENCE_VICTORIA_BASE_URL: http://victoriametrics:8428
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 6
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
    ports:
      - "${AIOPS_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  aiops-worker:
    image: ${AIOPS_WORKER_IMAGE:-aegisops/aiops-worker:0.1.0}
    build:
      context: ..
      dockerfile: deploy/docker/java-app.Dockerfile
      args:
        APP_MODULE: apps/aiops-worker
        APP_NAME: aiops-worker
        APP_PORT: 8081
    environment:
      <<: [*database-environment, *core-feature-environment]
      AIOPS_INTERNAL_AGENT_API_ENABLED: "false"
      AIOPS_WORKER_PORT: 8081
      AIOPS_RUNTIME_PHASE: ${AIOPS_RUNTIME_PHASE:-phase5}
      AIOPS_AGENT_BASE_URL: http://aiops-agent:9008
      AIOPS_AGENT_OAUTH2_TOKEN_URI: http://keycloak:8080/realms/aegisops/protocol/openid-connect/token
      AIOPS_AGENT_OAUTH2_CLIENT_ID: aiops-worker
      AIOPS_AGENT_OAUTH2_CLIENT_SECRET: ${AIOPS_WORKER_OAUTH2_CLIENT_SECRET:-dev-aiops-worker-client-secret}
      AIOPS_DIAGNOSIS_GRANT_SECRET: ${AIOPS_DIAGNOSIS_GRANT_SECRET:-dev-diagnosis-grant-secret-change-me}
      AIOPS_MINIO_ENDPOINT: http://minio:9000
      AIOPS_MINIO_ACCESS_KEY: ${AIOPS_MINIO_ACCESS_KEY:-minioadmin}
      AIOPS_MINIO_SECRET_KEY: ${AIOPS_MINIO_SECRET_KEY:-minioadmin}
      AIOPS_MINIO_BUCKET: ${AIOPS_MINIO_BUCKET:-aegisops-work-record}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 6
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  keycloak:
    profiles: ["ai", "demo"]
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AIOPS_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AIOPS_KEYCLOAK_ADMIN_PASSWORD:-dev-keycloak-admin}
      KC_HOSTNAME: http://localhost:8089
      AIOPS_SERVER_OAUTH2_CLIENT_SECRET: ${AIOPS_SERVER_OAUTH2_CLIENT_SECRET:-dev-aiops-server-client-secret}
      AIOPS_WORKER_OAUTH2_CLIENT_SECRET: ${AIOPS_WORKER_OAUTH2_CLIENT_SECRET:-dev-aiops-worker-client-secret}
      AIOPS_AGENT_OAUTH2_CLIENT_SECRET: ${AIOPS_AGENT_OAUTH2_CLIENT_SECRET:-dev-aiops-agent-client-secret}
    volumes:
      - ../infra/keycloak/aegisops-realm.json:/opt/keycloak/data/import/aegisops-realm.json:ro
    ports:
      - "${AIOPS_KEYCLOAK_PORT:-8089}:8080"
    restart: unless-stopped

  aiops-agent:
    profiles: ["ai", "demo"]
    image: ${AIOPS_AGENT_IMAGE:-aegisops/aiops-agent:0.1.0}
    build:
      context: ../apps/aiops-agent
      dockerfile: Dockerfile
    environment:
      AIOPS_AGENT_INBOUND_OAUTH2_ISSUER: http://localhost:8089/realms/aegisops
      AIOPS_AGENT_INBOUND_OAUTH2_JWKS_URL: http://keycloak:8080/realms/aegisops/protocol/openid-connect/certs
      AIOPS_AGENT_INBOUND_OAUTH2_AUDIENCE: aiops-agent-api
      AIOPS_AGENT_OUTBOUND_OAUTH2_TOKEN_URL: http://keycloak:8080/realms/aegisops/protocol/openid-connect/token
      AIOPS_AGENT_OUTBOUND_OAUTH2_CLIENT_ID: aiops-agent
      AIOPS_AGENT_OUTBOUND_OAUTH2_CLIENT_SECRET: ${AIOPS_AGENT_OAUTH2_CLIENT_SECRET:-dev-aiops-agent-client-secret}
      AIOPS_AGENT_OUTBOUND_OAUTH2_SCOPE: "evidence:read cases:read checkpoint:read checkpoint:write memory:read memory:write plugin:authorize"
      AIOPS_AGENT_GENERATION_MODE: ${AIOPS_AGENT_GENERATION_MODE:-workflow}
      AIOPS_AGENT_OPENAI_BASE_URL: ${AIOPS_AGENT_OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      AIOPS_AGENT_OPENAI_API_KEY: ${AIOPS_DEEPSEEK_API_KEY:-}
      AIOPS_AGENT_WORKFLOW_API_BASE_URL: http://aiops-server:8080
      AIOPS_AGENT_EVIDENCE_BASE_URL: http://aiops-server:8080/internal/agent/evidence
    ports:
      - "${AIOPS_AGENT_PORT:-9008}:9008"
    depends_on:
      keycloak:
        condition: service_started
    restart: unless-stopped

  aiops-runner:
    profiles: ["automation", "demo"]
    image: ${AIOPS_RUNNER_IMAGE:-aegisops/aiops-runner:0.1.0}
    build:
      context: ..
      dockerfile: apps/aiops-runner/Dockerfile
    environment:
      <<: *database-environment
      AIOPS_RUNNER_PORT: 8092
      AIOPS_RUNTIME_PHASE: ${AIOPS_RUNTIME_PHASE:-phase5}
      AIOPS_RUNNER_ID: ${AIOPS_RUNNER_ID:-compose-runner-1}
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /app/.runtime:size=512m,mode=1777
    restart: unless-stopped

  redis:
    profiles: ["distributed-cache", "demo"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${AIOPS_REDIS_PORT:-6379}:6379"
    volumes:
      - core_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    profiles: ["object-storage", "demo"]
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${AIOPS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AIOPS_MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${AIOPS_MINIO_CONSOLE_PORT:-9001}:9001"
      - "${AIOPS_MINIO_PORT:-9002}:9000"
    volumes:
      - core_minio_data:/data
    restart: unless-stopped

  minio-init:
    profiles: ["object-storage", "demo"]
    image: minio/mc:latest
    environment:
      AIOPS_MINIO_ACCESS_KEY: ${AIOPS_MINIO_ACCESS_KEY:-minioadmin}
      AIOPS_MINIO_SECRET_KEY: ${AIOPS_MINIO_SECRET_KEY:-minioadmin}
      AIOPS_MINIO_BUCKET: ${AIOPS_MINIO_BUCKET:-aegisops-work-record}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$${AIOPS_MINIO_ACCESS_KEY}" "$${AIOPS_MINIO_SECRET_KEY}"; do sleep 2; done &&
        mc mb --ignore-existing "local/$${AIOPS_MINIO_BUCKET}"
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  victoriametrics:
    profiles: ["observability", "demo"]
    image: victoriametrics/victoria-metrics:v1.109.1
    command: ["-storageDataPath=/storage", "-retentionPeriod=30d"]
    ports:
      - "${AIOPS_VICTORIA_METRICS_PORT:-8428}:8428"
    volumes:
      - core_vm_data:/storage
    restart: unless-stopped

  zabbix-postgres:
    profiles: ["demo-zabbix", "demo"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
    volumes:
      - core_zabbix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zabbix-server:
    profiles: ["demo-zabbix", "demo"]
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    restart: unless-stopped

  zabbix-web:
    profiles: ["demo-zabbix", "demo"]
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Asia/Shanghai
    ports:
      - "${ZABBIX_WEB_PORT:-8083}:8080"
    depends_on:
      zabbix-server:
        condition: service_started
    restart: unless-stopped

  zabbix-agent2:
    profiles: ["demo-zabbix", "demo"]
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    environment:
      ZBX_HOSTNAME: zabbix-agent2
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_ACTIVE: zabbix-server
    depends_on:
      zabbix-server:
        condition: service_started
    restart: unless-stopped

volumes:
  core_postgres_data:
  core_redis_data:
  core_minio_data:
  core_vm_data:
  core_zabbix_postgres_data:
